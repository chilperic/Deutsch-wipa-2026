        buildDashboard();
    } catch(err) {
        document.getElementById('app-root').innerHTML = "<h1>Database Error</h1><p>Check kapitel1.json path.</p>";
    }
}

// ... rest of the quiz logic, SRS engine, and speech synthesis ...
window.onload = loadVocabulary;
