<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabular · Gamified</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{  
  --bg:#08080a; --s1:#111115; --s2:#17171c; --s3:#1e1e25;  
  --bdr:#28282f; --bdr2:#333340;  
  --gold:#c9a84c; --gold2:#8a6f30; --gold3:#f0c96a;  
  --text:#e8e0d0; --dim:#7a7268; --muted:#4a4840; --dead:#2a2820;  
  --ok:#2ecc71; --ok2:#1a8a4a; --ok-bg:rgba(46,204,113,.1);  
  --err:#e74c3c; --err2:#a33; --err-bg:rgba(231,76,60,.1);  
  --warn:#e67e22; --info:#3498db;  
  --serif:'Cormorant Garamond',Georgia,serif;  
  --body:'Crimson Pro',Georgia,serif;  
  --mono:'JetBrains Mono',monospace;  
  --r:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px; overflow-x: hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.screen.on{display:flex}
.logo{font-family:var(--serif);font-size:42px;color:var(--gold);font-weight:600;letter-spacing:.02em; text-align: center; text-shadow: 0 2px 15px rgba(201,168,76,0.3);}
.tagline{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:4px; text-align: center;}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2);margin-bottom:6px;display:block}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:16px;padding:32px;width:100%;max-width:500px; box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);}
.card-gold{border-top:3px solid var(--gold)}
input[type=text],input[type=password],select{  
  width:100%;background:var(--s2);border:1px solid var(--bdr);color:var(--text);  
  padding:12px 14px;font-family:var(--body);font-size:16px;border-radius:6px; outline:none; transition: all 0.2s;
}
input:focus,select:focus{border-color:var(--gold2); box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.2);}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;border-radius:8px;padding:14px 20px;transition:all .2s; font-weight:700;}
.btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold2));color:#1a1200; box-shadow: 0 4px 15px rgba(201,168,76,0.2);}
.btn-gold:hover{filter:brightness(1.15); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(201,168,76,0.3);}
.btn-gold:active{transform: translateY(0);}
.btn-gold:disabled{background:var(--gold2);opacity:.5;cursor:not-allowed; transform: none;}
.btn-outline{background:transparent;color:var(--dim);border:1px solid var(--bdr)}.btn-outline:hover{border-color:var(--gold2);color:var(--text); background: var(--s2);}
.btn-block{display:block;width:100%}.btn-row{display:flex;gap:10px}
.pill-grp{display:flex;gap:8px;flex-wrap:wrap}.pill{font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;border:1px solid var(--bdr);cursor:pointer;color:var(--dim);background:var(--s2); transition: all 0.2s;}.pill.on{background:var(--gold);color:#1a1200;border-color:var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.2);}
#prog-track{position:fixed;top:0;left:0;right:0;height:4px;background:var(--bdr);z-index:200}#prog-fill{height:100%;background:var(--gold);transition:width .4s cubic-bezier(0.4, 0, 0.2, 1);width:0; box-shadow: 0 0 10px var(--gold);}
#quiz-header{position:sticky;top:0;z-index:100;width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(8, 8, 10, 0.85); backdrop-filter: blur(12px); border-bottom:1px solid var(--bdr)}
.qh-score{display:flex;gap:16px;font-family:var(--mono);font-size:14px; font-weight:bold; align-items:center;}
.qh-right{display:flex;gap:12px;align-items:center}
.streak-badge{font-family:var(--mono);font-size:13px;color:var(--warn);padding:4px 12px;background: rgba(230,126,34,.1); border:1px solid rgba(230,126,34,.3);border-radius:20px; font-weight:bold;}
.xp-badge{color:var(--info); background: rgba(52, 152, 219, 0.1); padding:4px 12px; border-radius:20px; border:1px solid rgba(52, 152, 219, 0.3);}
.icon-btn{background:var(--s2);border:1px solid var(--bdr);color:var(--dim);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center; transition: all 0.2s;}
.icon-btn:hover{background: var(--s3); color: var(--gold); transform: scale(1.05);}
#quiz-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;width:100%}
.qcard{width:100%;max-width:600px;display:flex;flex-direction:column;gap:0; position:relative;}
.word-area{text-align:center;padding:30px 12px 24px; position:relative;}
.word-main{font-family:var(--serif);font-style:italic;font-size:clamp(42px,8vw,72px);color:var(--text);line-height:1.1; text-shadow: 0 4px 20px rgba(0,0,0,0.5); display:inline-block;}
.speech-btn{background:none; border:none; color:var(--gold2); font-size:24px; cursor:pointer; vertical-align:middle; margin-left:10px; transition:all 0.2s;}
.speech-btn:hover{color:var(--gold); transform:scale(1.2);}
.word-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.15em;text-transform:uppercase}
.phase-lbl{font-family:var(--mono);font-size:12px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;text-align:center; opacity: 0.9; font-weight:bold;}
.art-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;padding:0 4px; margin-bottom: 20px;}
.art-btn{padding:20px 8px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;font-family:var(--mono);font-size:22px;color:var(--text);text-align:center; transition: all 0.2s; font-weight: 500;}
.art-btn:hover:not(:disabled){background:var(--s3); border-color:var(--gold2); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
.art-btn:disabled{cursor:default;}
.art-btn.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok); box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);}
.art-btn.wrong{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.opt-list{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.opt{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;font-family:var(--body);font-size:19px;color:var(--text); transition: all 0.2s;}
.opt:hover:not(:disabled):not(.correct):not(.wrong){background:var(--s3);border-color:var(--gold2); transform: translateX(6px);}
.opt.correct{background:var(--ok-bg);border-color:var(--ok); box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);}
.opt.wrong{background:var(--err-bg);border-color:var(--err)}
.opt-key{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:24px; font-weight: bold;}
.feedback{text-align:center;padding:16px 16px 8px;font-family:var(--mono);font-size:15px;min-height:44px; font-weight:bold;}
.fb-ok{color:var(--ok)} .fb-err{color:var(--err)}
.xp-float{position:absolute; color:var(--info); font-family:var(--mono); font-weight:bold; font-size:24px; pointer-events:none; animation: floatUp 1s ease-out forwards; z-index:500;}
.expl-panel{margin-top:16px;background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);}
.expl-section{padding:20px;border-bottom:1px solid var(--bdr)}
.expl-txt{font-size:16px;line-height:1.75;color:var(--dim)}
.expl-ex-de{font-style:italic;color:var(--text);font-size:17px}
.expl-ex-tr{color:var(--dim);font-size:15px;margin-top:6px}
.grammar-box{background:var(--s2);border:1px solid var(--bdr);border-radius:8px;padding:16px;margin-top:12px;}
.grammar-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--mono);font-size:14px;color:var(--text);}
.grammar-grid div{display:flex; justify-content:space-between; border-bottom:1px solid var(--bdr); padding-bottom:6px;}
.grammar-grid span:first-child{color:var(--dim);}
.link-row{display:flex;flex-wrap:wrap;gap:10px}
.dlink{font-family:var(--mono);font-size:12px;padding:8px 16px;background: var(--s2); border:1px solid var(--bdr);border-radius:20px;color:var(--dim);text-decoration:none; transition: all 0.2s; font-weight:bold;}
.dlink:hover{border-color:var(--gold2);color:var(--gold); background: var(--s3); transform:translateY(-2px);}
.dashboard-stats { display:flex; justify-content:space-around; background:var(--s2); border:1px solid var(--bdr); border-radius:10px; padding:20px; margin-bottom:24px; }
.d-stat { text-align:center; }
.d-stat-val { font-family:var(--serif); font-size:32px; color:var(--gold); line-height:1; margin-bottom:4px; }
.d-stat-lbl { font-family:var(--mono); font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em;}
.sum-hero{text-align:center;padding:30px 0 20px}.sum-score{font-family:var(--serif);font-size:96px;color:var(--gold);font-weight:300;line-height:1; text-shadow: 0 5px 30px rgba(201,168,76,0.3);}.sum-pct{font-family:var(--mono);font-size:16px;color:var(--info);margin-top:8px; font-weight:bold;}.sum-name{font-family:var(--serif);font-size:28px;color:var(--text);margin-bottom:4px}
.stat-chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}
.stat-chip{font-family:var(--mono);font-size:13px;padding:10px 18px;background: var(--s2); border-radius:20px;border:1px solid var(--bdr);color:var(--dim)}
.stat-chip span{color:var(--gold);margin-right:8px; font-weight: bold;}
.wrong-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto; padding-right: 5px;}
.wrong-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--s2);border-radius:8px;font-size:16px; border-left: 4px solid var(--err);}
.wrong-de{color:var(--text);font-family:var(--serif);font-style:italic; font-size: 20px;}.wrong-tr{color:var(--dim);font-size:15px}
#modal-bg, #lb-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:16px; backdrop-filter: blur(6px);}
#modal-bg.on, #lb-modal.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--bdr);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:36px;display:flex;flex-direction:column;gap:20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;}
.modal-ttl{font-family:var(--serif);font-size:28px;color:var(--gold);}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bdr); background:var(--s2); border-radius:8px; margin-bottom:8px;}
.lb-rank{font-family:var(--mono);font-size:14px;color:var(--dim); font-weight:bold; width:24px; text-align:center;}
.lb-name{flex:1;font-size:18px; font-family:var(--serif); color:var(--text);}
.lb-xp{font-family:var(--mono);font-size:14px;color:var(--info); font-weight:bold;}
hr{border:none;border-top:1px solid var(--bdr)}
.gap{display:flex;flex-direction:column;gap:16px}
.tip{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
.blink span { animation:blink 1.2s infinite; }
.blink span:nth-child(2){animation-delay:.2s}
.blink span:nth-child(3){animation-delay:.4s}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.anim-slide { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes floatUp { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-50px) scale(1.2); } }
@keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
.shake { animation: shake 0.3s ease-in-out; }
</style>
</head>
<body>

<div id="prog-track"><div id="prog-fill"></div></div>

<div class="screen on" id="screen-onboard">
<div class="card card-gold anim-slide">
  <div style="margin-bottom:24px; position:relative;">
    <button class="icon-btn" onclick="toggleSound()" id="sound-btn" style="position:absolute; right:0; top:0; border-color:var(--gold2); color:var(--gold);" title="Toggle Sound">🔊</button>
    <div class="logo">Vokabular</div>
    <div class="tagline">Mastery Edition</div>
  </div>

  <div class="dashboard-stats">
    <div class="d-stat">
      <div class="d-stat-val" id="dash-lvl">1</div>
      <div class="d-stat-lbl">Level</div>
    </div>
    <div class="d-stat">
      <div class="d-stat-val" id="dash-xp" style="color:var(--info)">0</div>
      <div class="d-stat-lbl">Total XP</div>
    </div>
    <div class="d-stat">
      <div class="d-stat-val" id="dash-best">0</div>
      <div class="d-stat-lbl">Best Score</div>
    </div>
  </div>

  <div class="gap">
    <div>
      <span class="lbl">Player Name</span>
      <input type="text" id="inp-name" placeholder="Enter your name" maxlength="20" onchange="saveName()">
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <span class="lbl">Native Lang</span>
        <select id="sel-native"></select>
      </div>
      <div style="flex:1">
        <span class="lbl">Chapter</span>
        <select id="sel-chapter"></select>
      </div>
    </div>
    <div>
      <span class="lbl">Words per session</span>
      <div class="pill-grp" id="pill-size">
        <span class="pill" data-n="5">5</span>
        <span class="pill on" data-n="10">10</span>
        <span class="pill" data-n="20">20</span>
        <span class="pill" data-n="all">All</span>
      </div>
    </div>
    <button class="btn btn-gold btn-block" id="btn-start" onclick="startSession()" style="padding:18px;font-size:15px;margin-top:10px; letter-spacing:0.15em;">▶ Launch Mission</button>
    <hr style="margin: 5px 0;">
    <button class="btn btn-outline btn-block" onclick="showLeaderboard()">🏆 Hall of Fame</button>
  </div>
</div>
</div>

<div class="screen" id="screen-quiz" style="padding:0;justify-content:flex-start">
  <div id="quiz-header">
    <div class="qh-score">
      <span class="xp-badge" id="qh-xp">0 XP</span>
      <span style="color:var(--ok)" id="qh-ok">0 ✓</span>
      <span style="color:var(--err)" id="qh-err">0 ✗</span>
    </div>
    <div class="qh-right">
      <span class="streak-badge" id="streak-badge" style="display:none"></span>
      <button class="icon-btn" onclick="confirmExit()">✕</button>
    </div>
  </div>
  <div id="quiz-body">
    <div class="qcard" id="qcard"></div>
  </div>
</div>

<div class="screen" id="screen-summary">
<div class="card card-gold anim-slide" style="max-width:600px;width:100%">
  <div class="sum-hero">
    <div class="sum-name" id="sum-name"></div>
    <div class="sum-score" id="sum-score"></div>
    <div class="sum-pct" id="sum-pct"></div>
    <div style="font-family:var(--mono); font-size:14px; color:var(--gold); margin-top:15px;" id="sum-pb"></div>
  </div>
  <div class="stat-chips" id="sum-chips"></div>
  <div id="sum-wrong-section" style="margin-top:20px">
    <span class="lbl">Critical Mistakes (Review)</span>
    <div class="wrong-list" id="sum-wrong-list"></div>
  </div>
  <div class="btn-row" style="margin-top:30px">
    <button class="btn btn-gold" style="flex:1" id="btn-review-wrong" onclick="reviewWrongWords()">↺ Drill Mistakes</button>
    <button class="btn btn-outline" style="flex:1" onclick="backToMenu()">← Command Center</button>
  </div>
</div>
</div>

<div id="lb-modal" onclick="if(event.target===this)this.classList.remove('on')">
<div class="modal anim-slide">
  <div class="modal-hdr">
    <span class="modal-ttl">🏆 Hall of Fame</span>
    <button class="icon-btn" onclick="document.getElementById('lb-modal').classList.remove('on')">✕</button>
  </div>
  <div id="lb-content"></div>
</div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()">
<div class="modal anim-slide">
  <div class="modal-hdr">
    <span class="modal-ttl">Dictionary Engine</span>
    <button class="icon-btn" onclick="closeModal()">✕</button>
  </div>
  <div>
    <span class="lbl">Anthropic API Key</span>
    <input type="password" id="m-apikey" placeholder="sk-ant-…" oninput="saveKey()">
    <p class="tip">Stored strictly locally in browser memory.</p>
  </div>
  <hr>
  <div>
    <span class="lbl">Translation Status</span>
    <p style="font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:12px" id="m-stats"></p>
    <button class="btn btn-gold btn-block" id="m-gen-btn" onclick="generateAll()">Compile Missing Translations</button>
    <p class="gen-prog blink" id="m-prog" style="display:none;margin-top:10px"></p>
  </div>
</div>
</div>

<script>
if (localStorage.getItem('vok_v8') !== 'true') {
  localStorage.clear();
  localStorage.setItem('vok_v8', 'true');
}

// --- CORE DATA, AUDIO & SPEECH ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundEnabled = true;

function playSound(type) {
  if (!soundEnabled) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'ok') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'err') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'lvlup') {
    osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.style.color = soundEnabled ? 'var(--gold)' : 'var(--dim)';
  btn.style.borderColor = soundEnabled ? 'var(--gold2)' : 'var(--bdr)';
  persist();
}

function speakWord(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE';
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

const LANGS = ['English','French','Arabic','Persian','Spanish','Ukrainian','Russian','Italian','Swahili'];
const ARTICLES = ['der','die','das','—'];

function getLeoLang(nativeLang) {
  const map = { 'English':'ende', 'French':'frde', 'Spanish':'esde', 'Italian':'itde', 'Russian':'rude', 'Polish':'plde', 'Portuguese':'ptde', 'Chinese':'chde' };
  return map[nativeLang];
}

function extLinks(word, nativeLang) {
  const base = encodeURIComponent(String(word||'').replace(/^(die|der|das|sich)\s+/i,'').split(',')[0].split('(')[0].trim());
  const leoLang = getLeoLang(nativeLang);
  let links = [
    {n:'Duden', c:'#f0c96a', u:`https://www.duden.de/suchen/dudenonline/${base}`},
    {n:'DWDS', c:'#3498db', u:`https://www.dwds.de/wb/${base}`},
    {n:'Verbformen', c:'#e74c3c', u:`https://www.verbformen.de/?w=${base}`}
  ];
  if(leoLang) links.push({n:'Leo', c:'#2ecc71', u:`https://dict.leo.org/${leoLang}/search?query=${base}`});
  return links;
}

    { "id": "k4_06", "word": "der Linienverkehr", "notes": "Kapitel 4", "status": "done", "data": { "translations": { "English": "regular service / scheduled traffic", "French": "service régulier", "Arabic": "خدمة نقل منتظمة", "Persian": "ترافیک خطوط منظم", "Spanish": "servicio regular", "Ukrainian": "регулярне сполучення", "Russian": "регулярное сообщение", "Italian": "servizio di linea", "Swahili": "huduma ya kawaida" }, "explanation": "Transport running on a regular schedule.", "example_de": "Der Bus fährt im Linienverkehr.", "example_translated": "The bus operates on a regular schedule.", "grammar": { "type": "noun", "singular": "der Linienverkehr", "plural": "— (Singular only)" } } },
    { "id": "k4_07", "word": "färben", "notes": "Kapitel 4", "status": "done", "data": { "translations": { "English": "to dye / color", "French": "colorer / teindre", "Arabic": "يصبغ", "Persian": "رنگ کردن", "Spanish": "teñir", "Ukrainian": "фарбувати", "Russian": "красить", "Italian": "tingere", "Swahili": "kupaka rangi" }, "explanation": "To change the color of something (especially hair or clothes).", "example_de": "Sie möchte sich die Haare färben.", "example_translated": "She wants to dye her hair.", "grammar": { "type": "verb", "conjugation": { "ich": "färbe", "du": "färbst", "er/sie/es": "färbt", "wir": "färben", "ihr": "färbt", "sie/Sie": "färben" } } } },
    { "id": "k4_08", "word": "frisieren", "notes": "Kapitel 4", "status": "done", "data": { "translations": { "English": "to do hair / style", "French": "coiffer", "Arabic": "يصفف الشعر", "Persian": "مدل مو درست کردن", "Spanish": "peinar", "Ukrainian": "робити зачіску", "Russian": "делать прическу", "Italian": "pettinare", "Swahili": "kutengeneza nywele" }, "explanation": "To arrange or style hair.", "example_de": "Der Friseur frisiert die Kundin.", "example_translated": "The hairdresser is styling the client.", "grammar": { "type": "verb", "conjugation": { "ich": "frisiere", "du": "frisierst", "er/sie/es": "frisiert", "wir": "frisieren", "ihr": "frisiert", "sie/Sie": "frisieren" } } } },
    { "id": "k4_09", "word": "die Haarpflege", "notes": "Kapitel 4", "status": "done", "data": { "translations": { "English": "hair care", "French": "soins des cheveux", "Arabic": "العناية بالشعر", "Persian": "مراقبت از مو", "Spanish": "cuidado del cabello", "Ukrainian": "догляд за волоссям", "Russian": "уход за волосами", "Italian": "cura dei capelli", "Swahili": "huduma ya nywele" }, "explanation": "Maintenance and hygiene of hair.", "example_de": "Gute Haarpflege ist ihr wichtig.", "example_translated": "Good hair care is important to her.", "grammar": { "type": "noun", "singular": "die Haarpflege", "plural": "— (Singular only)" } } },
    { "id": "k4_10", "word": "der Fingernagel", "notes": "Kapitel 4", "status": "done", "data": { "translations": { "English": "fingernail", "French": "ongle", "Arabic": "ظفر الإصبع", "Persian": "ناخن", "Spanish": "uña", "Ukrainian": "ніготь", "Russian": "ноготь", "Italian": "unghia", "Swahili": "kucha" }, "explanation": "The horny covering on the upper surface of the tip of the finger.", "example_de": "Sie lackiert sich die Fingernägel.", "example_translated": "She is painting her fingernails.", "grammar": { "type": "noun", "singular": "der Fingernagel", "plural": "die Fingernägel" } } }
  ]
};

let USER = { name: '', nativeLang: 'English', chapter: 'all', sessionSize: 10, xp: 0, bestScore: 0, sound: true };
let LEADERBOARD = [];
let Q = { pool: [], queue: [], idx: 0, correct: 0, wrong: 0, streak: 0, maxStreak: 0, sessionXP: 0, wrongItems: [], cur: null };

function persist() {
  try { 
    localStorage.setItem('vok_u_m2', JSON.stringify(USER)); 
    localStorage.setItem('vok_lb', JSON.stringify(LEADERBOARD));
  } catch(e){}
}

function loadStorage() {
  try {
    const u = localStorage.getItem('vok_u_m2');
    const lb = localStorage.getItem('vok_lb');
    if (u) {
      Object.assign(USER, JSON.parse(u));
      soundEnabled = USER.sound;
      const btn = document.getElementById('sound-btn');
      if(!soundEnabled) { btn.textContent = '🔇'; btn.style.color = 'var(--dim)'; btn.style.borderColor = 'var(--bdr)'; }
    }
    if (lb) LEADERBOARD = JSON.parse(lb);
  } catch(e){}
}

function saveName() { USER.name = document.getElementById('inp-name').value.trim(); persist(); }

// Fisher-Yates True Shuffle
function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function wordsForChapter(chapter) {
  if (chapter==='all') return W.words.filter(w=>w.status==='done');
  return W.words.filter(w=>w.status==='done' && getChapter(w)===chapter);
}

function buildMeaningOpts(entry, pool, lang) {
  if (!entry || !entry.data || !entry.data.translations) return [{txt:'—', isCorrect:true}];
  const correct = entry.data.translations[lang] || '?';
  const others = shuffle(pool.filter(w => w.id!==entry.id && w.data?.translations?.[lang])).slice(0,3).map(w => ({txt: w.data.translations[lang], isCorrect: false}));
  while (others.length < 3) others.push({txt:'—', isCorrect:false});
  return shuffle([{txt:correct, isCorrect:true}, ...others]);
}

function getLevel(xp) { return Math.floor(Math.sqrt(xp / 50)) + 1; }

function startSession() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  USER.name = document.getElementById('inp-name').value.trim() || 'Player ' + Math.floor(Math.random()*1000);
  USER.nativeLang = document.getElementById('sel-native').value;
  USER.chapter = document.getElementById('sel-chapter').value;
  USER.sessionSize = document.getElementById('pill-size').querySelector('.on')?.dataset.n || '10';
  USER.sound = soundEnabled;
  persist();
  
  const pool = wordsForChapter(USER.chapter);
  if (pool.length < 4) { alert(`Not enough words in this chapter. Total: ${pool.length}`); return; }
  Q.pool = pool;
  const n = USER.sessionSize==='all' ? pool.length : Math.min(parseInt(USER.sessionSize)||10, pool.length);
  
  Q.queue = shuffle([...pool]).slice(0,n).map(w=>w.id);
  Q.idx = 0; Q.correct = 0; Q.wrong = 0; Q.streak = 0; Q.maxStreak = 0; Q.sessionXP = 0; Q.wrongItems = []; Q.cur = null;
  
  showScreen('screen-quiz'); loadWord();
}

function reviewWrongWords() {
  if (!Q.wrongItems.length) { backToMenu(); return; }
  const ids = [...new Set(Q.wrongItems.map(w=>w.id))];
  Q.queue = shuffle(ids); Q.idx = 0; Q.correct = 0; Q.wrong = 0; Q.streak = 0; Q.maxStreak = 0; Q.sessionXP = 0; Q.wrongItems = [];
  showScreen('screen-quiz'); loadWord();
}

function loadWord() {
  if (Q.idx >= Q.queue.length) { endSession(); return; }
  const entry = W.words.find(w=>w.id===Q.queue[Q.idx]);
  const trueArticle = getArticle(entry.word);
  const opts = buildMeaningOpts(entry, Q.pool, USER.nativeLang);
  
  Q.cur = { 
    entry, trueArticle, hasArticle: !!trueArticle,
    phase: !!trueArticle ? 'article' : 'meaning', 
    options: opts, artSelected: null, meanSelected: null, showDet: false, wordFailed: false
  };
  
  if (soundEnabled) speakWord(getBase(entry.word));
  renderQuiz();
}

function showFloatingXP(amt) {
  const el = document.createElement('div');
  el.className = 'xp-float';
  el.textContent = `+${amt} XP`;
  el.style.left = '50%'; el.style.top = '40%';
  document.getElementById('qcard').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function selectArticle(guess) {
  if (!Q.cur || Q.cur.phase !== 'article') return;
  Q.cur.artSelected = guess;
  
  if (guess === Q.cur.trueArticle) {
    playSound('ok');
    Q.cur.phase = 'meaning';
  } else {
    playSound('err');
    document.getElementById('qcard').classList.add('shake');
    setTimeout(()=>document.getElementById('qcard').classList.remove('shake'), 300);
    Q.cur.wordFailed = true;
    Q.streak = 0;
    Q.cur.phase = 'meaning';
  }
  renderQuiz();
}

function selectMeaning(i) {
  if (!Q.cur || (Q.cur.phase !== 'meaning')) return;
  const opt = Q.cur.options[i];
  Q.cur.meanSelected = i;
  Q.cur.phase = 'done';
  
  if (!opt.isCorrect) Q.cur.wordFailed = true;

  if (Q.cur.wordFailed) {
    playSound('err');
    document.getElementById('qcard').classList.add('shake');
    setTimeout(()=>document.getElementById('qcard').classList.remove('shake'), 300);
    Q.wrong++; Q.streak = 0;
    Q.wrongItems.push({ id: Q.cur.entry.id, word: Q.cur.entry.word, correctMeaning: Q.cur.options.find(o=>o.isCorrect)?.txt || '—' });
    Q.queue.push(Q.queue[Q.idx]); // Spaced Repetition Logic
  } else {
    playSound('ok');
    Q.correct++; Q.streak++; Q.maxStreak = Math.max(Q.maxStreak, Q.streak);
    
    let pts = 10 + (Q.streak * 2);
    Q.sessionXP += pts;
    USER.xp += pts;
    persist();
    showFloatingXP(pts);
  }
  renderQuiz();
}

const nextWord = () => { Q.idx++; loadWord(); };

function endSession() {
  const pct = (Q.correct + Q.wrong) ? Math.round(Q.correct / (Q.correct + Q.wrong) * 100) : 0;
  let isNewBest = false;
  if (Q.sessionXP > USER.bestScore) {
    USER.bestScore = Q.sessionXP;
    isNewBest = true;
    playSound('lvlup');
  }
  
  LEADERBOARD.push({ name: USER.name, xp: Q.sessionXP, pct: pct, date: new Date().toLocaleDateString() });
  LEADERBOARD.sort((a,b) => b.xp - a.xp);
  LEADERBOARD = LEADERBOARD.slice(0, 10);
  
  persist();
  renderSummary(pct, isNewBest); showScreen('screen-summary');
}

const confirmExit = () => { if (confirm('Abort mission? Progress will be lost.')) backToMenu(); };
function backToMenu() { Q.cur = null; Q.queue = []; showScreen('screen-onboard'); buildDashboard(); }

function renderQuiz() {
  const card = document.getElementById('qcard');
  if (!Q.cur) return;
  const { entry, phase, options, showDet, trueArticle, artSelected, meanSelected } = Q.cur;

  document.getElementById('qh-xp').textContent = `${Q.sessionXP} XP`;
  document.getElementById('qh-ok').textContent = `${Q.correct} ✓`;
  document.getElementById('qh-err').textContent = `${Q.wrong} ✗`;
  const sb = document.getElementById('streak-badge');
  if (Q.streak >= 3) { sb.textContent = `🔥 x${Q.streak}`; sb.style.display=''; } else sb.style.display='none';
  document.getElementById('prog-fill').style.width = `${Math.round(Q.idx / Q.queue.length * 100)}%`;

  let artHTML = '';
  if (Q.cur.hasArticle) {
    if (phase === 'article') {
      artHTML = `<p class="phase-lbl anim-slide">Select the article</p><div class="art-grid anim-slide">${ARTICLES.map(a => `<button class="art-btn" onclick="selectArticle('${a}')">${a}</button>`).join('')}</div>`;
    } else {
      const color = (artSelected === trueArticle) ? 'var(--ok)' : 'var(--err)';
      artHTML = `<div style="text-align:center; font-family:var(--mono); font-size:24px; color:${color}; font-weight:bold; margin-bottom:10px;" class="anim-slide">${trueArticle}</div>`;
    }
  }

  let meanHTML = '';
  if (phase === 'meaning' || phase === 'done') {
    const keys = ['A','B','C','D'];
    const optsHTML = options.map((opt, i) => {
      let cls = 'opt';
      if (phase === 'done') {
        if (opt.isCorrect) cls += ' correct';
        else if (i === meanSelected) cls += ' wrong';
      }
      return `<button class="${cls} anim-slide" style="animation-delay: ${i*0.1}s" onclick="selectMeaning(${i})" ${phase==='done'?'disabled':''}>
        <span class="opt-key">${keys[i]}</span><span class="opt-txt">${h(opt.txt)}</span></button>`;
    }).join('');
    meanHTML = `<p class="phase-lbl anim-slide" style="margin-top:20px;">What does it mean?</p><div class="opt-list">${optsHTML}</div>`;
  }

  let fbHTML = ''; let nextHTML = '';
  if (phase === 'done') {
    fbHTML = Q.cur.wordFailed 
      ? `<p class="feedback fb-err anim-slide">✗ Review queue updated.</p>` 
      : `<p class="feedback fb-ok anim-slide">✓ Excellent work!</p>`;
    nextHTML = `<button class="next-btn btn-gold anim-slide" onclick="nextWord()">Continue →</button>`;
  }

  const explHTML = (showDet && entry.data) ? buildExplPanel(entry) : '';
  const explBtnHTML = (phase === 'done') ? `<button class="expl-btn anim-slide" onclick="toggleExpl()">📖 ${showDet?'Hide Database':'Access Database'}</button>` : '';
  const wordBase = getBase(entry.word);

  card.innerHTML = `
    <div class="word-area anim-slide">
      ${artHTML && phase !== 'article' ? artHTML : ''}
      <div class="word-main">${h(wordBase)}<button class="speech-btn" onclick="speakWord('${h(wordBase)}')">🔊</button></div>
      ${entry.notes ? `<div class="word-note">${h(entry.notes)}</div>` : ''}
    </div>
    ${phase === 'article' ? artHTML : ''}
    ${meanHTML}
    ${fbHTML}
    ${nextHTML}
    ${explBtnHTML}
    ${explHTML}
  `;
}

const toggleExpl = () => { Q.cur.showDet = !Q.cur.showDet; renderQuiz(); };

function buildExplPanel(entry) {
  const d = entry.data; if (!d) return '';
  const g = d.grammar;
  const userLang = USER.nativeLang;
  const userTranslation = d.translations?.[userLang] || 'N/A';
  
  let grammarHTML = '';
  if (g) {
    if (g.type === 'noun') {
      grammarHTML = `<div class="grammar-box"><div class="grammar-grid"><div><span>Singular</span><span>${h(g.singular||'')}</span></div><div><span>Plural</span><span>${h(g.plural||'')}</span></div></div></div>`;
    } else if (g.type === 'verb' && g.conjugation) {
      grammarHTML = `<div class="grammar-box"><div class="grammar-grid"><div><span>ich</span><span>${h(g.conjugation.ich||'')}</span></div><div><span>wir</span><span>${h(g.conjugation.wir||'')}</span></div><div><span>du</span><span>${h(g.conjugation.du||'')}</span></div><div><span>ihr</span><span>${h(g.conjugation.ihr||'')}</span></div><div><span>er/sie/es</span><span>${h(g.conjugation['er/sie/es']||'')}</span></div><div><span>sie/Sie</span><span>${h(g.conjugation['sie/Sie']||'')}</span></div></div></div>`;
    }
  }

  let externalLinks = extLinks(entry.word, userLang);
  let linkRow = externalLinks.map(l=>`<a class="dlink" href="${l.u}" target="_blank" style="border-color:${l.c}; color:${l.c}">${l.n}</a>`).join('');

  return `<div class="expl-panel anim-slide"><div class="expl-section" style="text-align:center; padding-bottom:10px;"><span class="lbl">Translation (${userLang})</span><div style="font-family:var(--serif); font-size:24px; color:var(--gold);">${h(userTranslation)}</div></div><div class="expl-section"><span class="lbl">Structure</span>${grammarHTML}<p class="expl-txt" style="margin-top:10px;">${h(d.explanation)}</p></div><div class="expl-section"><span class="lbl">Example Sentence</span><p class="expl-ex-de">„${h(d.example_de)}" <button style="background:none;border:none;color:var(--info);cursor:pointer;" onclick="speakWord('${h(d.example_de)}')">🔊</button></p><p class="expl-ex-tr">${h(d.example_translated||'')}</p></div><div class="expl-section"><span class="lbl">Dictionaries</span><div class="link-row">${linkRow}</div></div></div>`;
}

function renderSummary(pct, isNewBest) {
  document.getElementById('sum-name').textContent = USER.name;
  document.getElementById('sum-score').textContent = `+${Q.sessionXP} XP`;
  document.getElementById('sum-pct').textContent = `Accuracy: ${pct}% · ${Q.correct}/${Q.queue.length} clears`;
  document.getElementById('sum-pb').innerHTML = isNewBest ? '🏆 NEW PERSONAL BEST!' : `Best Score: ${USER.bestScore} XP`;
  document.getElementById('sum-chips').innerHTML = [['🔥 Best Streak', Q.maxStreak],['📚 Chapter', USER.chapter==='all'?'All':`Kapitel ${USER.chapter}`]].map(([k,v])=>`<span class="stat-chip"><span>${v}</span>${k}</span>`).join('');
  
  const btnReview = document.getElementById('btn-review-wrong');
  if(Q.wrongItems.length > 0) {
    btnReview.style.display = 'inline-block';
    document.getElementById('sum-wrong-section').style.display = 'block';
    document.getElementById('sum-wrong-list').innerHTML = Q.wrongItems.map(w=>`<div class="wrong-item"><span class="wrong-de">${h(w.word)}</span><span class="wrong-tr">${h(w.correctMeaning)}</span></div>`).join('');
  } else {
    btnReview.style.display = 'none';
    document.getElementById('sum-wrong-section').style.display = 'none';
  }
}

function showLeaderboard() {
  const lb = document.getElementById('lb-content');
  if (LEADERBOARD.length === 0) {
    lb.innerHTML = '<p style="color:var(--dim); text-align:center;">No records yet. Be the first to launch a mission!</p>';
  } else {
    const medals = ['🥇', '🥈', '🥉'];
    lb.innerHTML = LEADERBOARD.map((s, i) => `
      <div class="lb-row anim-slide" style="animation-delay:${i*0.05}s">
        <span class="lb-rank">${medals[i] || (i+1)}</span>
        <span class="lb-name">${h(s.name)} <span style="font-size:12px; color:var(--dim); font-family:var(--mono);">(${s.pct}%)</span></span>
        <span class="lb-xp">${s.xp} XP</span>
      </div>
    `).join('');
  }
  document.getElementById('lb-modal').classList.add('on');
}

function buildDashboard() {
  document.getElementById('inp-name').value = USER.name;
  document.getElementById('dash-lvl').textContent = getLevel(USER.xp);
  document.getElementById('dash-xp').textContent = USER.xp;
  document.getElementById('dash-best').textContent = USER.bestScore;

  ['sel-native','sel-expl'].forEach((id,k)=>{
    document.getElementById(id).innerHTML = LANGS.map(l=>`<option value="${l}" ${l===(k===0?USER.nativeLang:USER.explLang)?'selected':''}>${l}</option>`).join('');
  });
  const chapters = detectChapters(W.words);
  document.getElementById('sel-chapter').innerHTML = `<option value="all">All Chapters (${W.words.filter(w=>w.status==='done').length} loaded)</option>` + chapters.map(c=>`<option value="${c}" ${USER.chapter===c?'selected':''}>Kapitel ${c}</option>`).join('');
  
  document.querySelectorAll('#pill-size .pill').forEach(p => {
    if(p.dataset.n === String(USER.sessionSize)) p.classList.add('on');
    else p.classList.remove('on');
  });
}

function openSettings() { document.getElementById('modal-bg').classList.add('on'); }
function closeModal() { document.getElementById('modal-bg').classList.remove('on'); buildDashboard(); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); document.getElementById(id).classList.add('on'); }

document.getElementById('pill-size').addEventListener('click', e=>{
  const p = e.target.closest('.pill'); if(!p) return;
  document.querySelectorAll('#pill-size .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on');
  USER.sessionSize = p.dataset.n; persist();
});

loadStorage(); buildDashboard();
</script>
