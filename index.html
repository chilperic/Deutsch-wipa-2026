<style>
/* CSS Reset and Variables - Same High-End Aesthetic */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080a; --s1:#111115; --s2:#17171c; --gold:#c9a84c; --gold2:#8a6f30; --text:#e8e0d0; --dim:#7a7268; --ok:#2ecc71; --err:#e74c3c; --info:#3498db; --r:8px;}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',serif;font-size:17px;}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.on{display:flex}
.card{background:var(--s1);border:1px solid #28282f;border-radius:16px;padding:32px;width:100%;max-width:500px; border-top:3px solid var(--gold);}
.btn{font-family:var(--mono);font-size:12px;text-transform:uppercase;border:none;cursor:pointer;border-radius:8px;padding:14px 20px;transition:all .2s; font-weight:700;}
.btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold2));color:#1a1200;}
.btn-outline{background:transparent;color:var(--dim);border:1px solid #28282f;}
.btn-block{display:block;width:100%;}
.phase-lbl{font-family:var(--mono);font-size:11px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:15px;text-align:center;}
/* Basic UI styles added for completeness, same as previous reliable build */
</style>
