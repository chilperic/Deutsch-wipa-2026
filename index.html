<!doctype html>
<html lang="de" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#145A6E" />
  <meta name="description" content="Deutsch-WiPA 2026 — B1/B2 Beruf German trainer based on Linie-style workplace learning." />
  <title>Deutsch-WiPA 2026 · B1/B2 Beruf</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Skip link targets the first focusable control, not a heading -->
  <a class="skip-link" href="#startButton">Skip to exercise</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="menuToggle" class="icon-button" aria-label="Open navigation">☰</button>
      <div class="brand-block">
        <div class="brand-lockup"><img src="assets/icon.svg" alt="" class="brand-logo" /><div><div class="brand-title">Deutsch-WiPA</div>
        <div class="brand-subtitle" data-i18n="subtitle">B1/B2 Beruf trainer</div></div></div>
      </div>
      <div class="topbar-controls">
        <select id="languageSelect" class="select" aria-label="Interface language"></select>
        <button id="themeToggle" class="icon-button" aria-label="Toggle appearance">◐</button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="Learning navigation">
      <section class="panel profile-panel">
        <label class="field-label" data-i18n="learnerName">Learner name</label>
        <input id="learnerName" class="input" type="text" placeholder="Name" autocomplete="name" />
        <div class="level-pill">B1 → B2 · Linie Beruf</div>
      </section>

      <section class="panel">
        <!-- h3 so sidebar headings don't outrank main h2 -->
        <h3 data-i18n="learningPath">Learning path</h3>
        <!-- Event delegation: clicks bubble up from cat-button children -->
        <nav id="categoryNav" class="category-nav" role="navigation" aria-label="Learning categories"></nav>
      </section>

      <section class="panel">
        <h3 data-i18n="module">Module</h3>
        <select id="moduleSelect" class="select wide"></select>
        <div id="moduleCount" class="minor"></div>
      </section>

      <section class="panel progress-panel">
        <h3 data-i18n="progress">Progress</h3>
        <!-- aria-live on the percentage span only, not the whole ring -->
        <div class="progress-ring">
          <span id="progressPercent" aria-live="polite" aria-atomic="true">0%</span>
        </div>
        <div class="stat-grid">
          <div><strong id="statAnswered">0</strong><span data-i18n="answered">Answered</span></div>
          <div><strong id="statCorrect">0</strong><span data-i18n="correct">Correct</span></div>
          <div><strong id="statMistakes">0</strong><span data-i18n="mistakes">Mistakes</span></div>
        </div>
        <!-- Global stats line -->
        <div id="globalStats" class="minor" style="margin-top:4px"></div>
        <button id="resetModule" class="ghost-button" data-i18n="restartModule">Restart module</button>
      </section>
    </aside>

    <main class="main-panel" role="main">
      <section class="toolbar-card">
        <div>
          <div class="eyebrow" id="currentPath">Wortschatz · Kapitel</div>
          <!-- h2 for main exercise title (sidebar uses h3) -->
          <h2 id="exercise-title" data-i18n="exercise">Exercise</h2>
        </div>
        <div class="toolbar-group">
          <select id="modeSelect" class="select" aria-label="Training mode">
            <option value="learn" data-i18n="learnMode">Learn</option>
            <option value="practice" data-i18n="practiceMode">Practice</option>
            <option value="challenge" data-i18n="challengeMode">Challenge</option>
            <option value="mistakes" data-i18n="mistakeReview">Mistakes</option>
          </select>
          <!-- Exercise type grouped by skill area -->
          <select id="exerciseTypeSelect" class="select" aria-label="Exercise type"></select>
          <button id="installButton" class="ghost-button hidden" data-i18n="install">Install</button>
        </div>
      </section>

      <!-- aria-live removed from card; only questionText announces -->
      <section id="exerciseCard" class="exercise-card">
        <div class="card-meta">
          <span id="itemIndex">0 / 0</span>
          <span id="itemLevel">B1/B2</span>
        </div>
        <!-- Only the question text needs live announcement -->
        <div id="questionText" class="question-text" aria-live="polite" aria-atomic="true"></div>
        <div id="choiceList" class="choice-list hidden"></div>
        <input id="answerInput" class="answer-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <textarea id="answerTextArea" class="answer-textarea hidden" rows="7" spellcheck="true"></textarea>
        <div id="learnBlock" class="learn-block hidden"></div>
        <div id="feedbackBox" class="feedback-box hidden" aria-live="polite"></div>
      </section>

      <section class="button-row bottom-actions" aria-label="Exercise controls">
        <button id="prevButton" class="secondary-button" data-i18n="previous">Previous</button>
        <button id="startButton" class="primary-button" data-i18n="start">Start</button>
        <button id="checkButton" class="primary-button" data-i18n="check">Check</button>
        <button id="nextButton" class="secondary-button" data-i18n="next">Next</button>
      </section>
    </main>

    <aside class="helper-panel" aria-label="Learning support">
      <section class="panel">
        <h3 data-i18n="helper">Helper</h3>
        <div id="hintBox" class="helper-box"></div>
      </section>
      <section class="panel">
        <h3 data-i18n="mistakeBank">Mistake bank</h3>
        <div id="mistakeList" class="mistake-list"></div>
        <button id="clearMistakes" class="ghost-button" data-i18n="clearMistakes">Clear mistakes</button>
      </section>
    </aside>
  </div>

  <div id="mobileDrawerBackdrop" class="drawer-backdrop hidden"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
