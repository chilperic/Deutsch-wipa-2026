<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="vok-card">
    <h1>Vokabular</h1>
    <p style="font-size: 0.8rem; color: var(--gold);">DEUTSCH LERNEN · GERMAN VOCABULARY TRAINER</p>

    <label class="label">Your Name</label>
    <input id="userName" placeholder="foko">

    <label class="label">I Speak / Quiz Language</label>
    <select id="lang"><option>English</option><option>Persian</option></select>

    <label class="label">Explanations In</label>
    <select id="expl"><option>French</option><option>English</option></select>

    <label class="label">Chapter</label>
    <select id="chap"><option>Kapitel 1</option><option>Kapitel 2</option></select>

    <label class="label">Words Per Session</label>
    <div class="btn-grid" id="countGrid">
        <button onclick="setCount(10)">10</button>
        <button onclick="setCount(20)" class="active">20</button>
        <button onclick="setCount(30)">30</button>
        <button onclick="setCount(50)">50</button>
        <button onclick="setCount('All')">All</button>
    </div>

    <button id="start-btn" onclick="startQuiz()">▶ START QUIZ</button>
</div>

<script>
let state = { count: 20 };
function setCount(n) {
    state.count = n;
    document.querySelectorAll('.btn-grid button').forEach(b => b.classList.toggle('active', b.innerText == n));
}
function startQuiz() {
    alert("Mission: " + document.getElementById('chap').value + " | Words: " + state.count);
    // Navigation to the quiz engine logic follows here
}
</script>
</body>
</html>
