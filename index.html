<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deutsch WIPA 2026 · Deutsch Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6;--panel:#fffaf1;--panel2:#f7efe2;--ink:#172126;--muted:#6b746f;--line:#ded3c0;
  --brand:#116466;--brand2:#0b4142;--accent:#ff6b4a;--accent2:#ffbe5c;--good:#16885a;--bad:#c53c3c;
  --blue:#3c6ee8;--shadow:0 24px 80px rgba(23,33,38,.12);
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
body.dark{
  --bg:#101923;--panel:#162332;--panel2:#1c2b3b;--ink:#f6efe2;--muted:#aeb8b2;--line:#314152;
  --brand:#4ecdc4;--brand2:#2ba7a0;--accent:#ff7b5f;--accent2:#ffd166;--good:#66e0a4;--bad:#ff7474;
  --blue:#82a8ff;--shadow:0 24px 80px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:
  radial-gradient(900px 520px at 12% -10%,rgba(17,100,102,.18),transparent 58%),
  radial-gradient(860px 500px at 100% 0%,rgba(255,107,74,.16),transparent 56%),
  linear-gradient(180deg,var(--bg),var(--panel2));
  color:var(--ink);font-family:var(--sans);font-size:16px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{padding:26px 20px;border-right:1px solid var(--line);background:rgba(255,255,255,.35);backdrop-filter:blur(18px)}
.dark .side{background:rgba(10,18,26,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logoMark{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:white;font-family:var(--serif);font-weight:800;font-size:23px;box-shadow:var(--shadow)}
.brand h1{font-family:var(--serif);font-size:26px;line-height:1;color:var(--brand2)}
.dark .brand h1{color:var(--brand)}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:16px;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.on{background:var(--panel);color:var(--brand2);box-shadow:0 8px 24px rgba(0,0,0,.05)}
.dark .nav button:hover,.dark .nav button.on{color:var(--brand);background:var(--panel2)}
.streak{margin-top:26px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.streak strong{font-family:var(--serif);font-size:38px;color:var(--accent)}
.main{padding:30px 38px 42px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.title h2{font-family:var(--serif);font-size:clamp(42px,7vw,78px);line-height:.9;color:var(--brand2);letter-spacing:-.045em}
.dark .title h2{color:var(--brand)}
.title p{margin-top:10px;color:var(--muted);font-weight:600}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 14px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.04)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;border:0;padding:15px 28px;box-shadow:0 16px 40px rgba(17,100,102,.24)}
.btn.coral{background:linear-gradient(135deg,var(--accent),#e24d33);color:white;border:0}
.screen{display:none}.screen.on{display:block}
.gridStats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:34px;color:var(--brand2)}.dark .stat b{color:var(--brand)}
.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.moduleGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.module{border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:18px;min-height:184px;box-shadow:var(--shadow);transition:.15s;position:relative;overflow:hidden}
.module:before{content:"";position:absolute;inset:auto -30px -70px auto;width:130px;height:130px;border-radius:999px;background:rgba(17,100,102,.08)}
.module:hover{transform:translateY(-2px);border-color:var(--brand)}
.module.on{border:2px solid var(--brand);background:linear-gradient(180deg,var(--panel),rgba(17,100,102,.08))}
.module .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.module .badge{position:absolute;right:14px;top:14px;font-size:10px;font-weight:900;text-transform:uppercase;background:rgba(22,136,90,.12);color:var(--good);padding:5px 8px;border-radius:999px}
.module .ico{font-size:30px;margin:20px 0 10px}
.module h3{font-family:var(--serif);font-size:22px;line-height:1.05;margin-bottom:8px}
.module p{color:var(--muted);font-size:13px;line-height:1.35;font-weight:600}
.module small{display:block;margin-top:12px;color:var(--brand);font-weight:900}
.config{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.configGrid{display:grid;grid-template-columns:1fr 1fr 1.2fr .9fr;gap:14px;align-items:end}
label{display:block;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}
select,input{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:12px;outline:0}
select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(17,100,102,.12)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:11px 13px;font-weight:900;color:var(--muted);background:var(--panel2)}
.pill.on{background:var(--accent2);color:#271600;border-color:transparent}
.startRow{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.status{color:var(--muted);font-size:13px;margin-top:12px;text-align:center}
.quizWrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column}
.quizTop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.quizCenter{flex:1;display:grid;place-items:center}
.qcard{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:34px;padding:34px;box-shadow:var(--shadow)}
.word{text-align:center;margin-bottom:18px}
.wordArt{font-family:var(--mono);font-size:20px;color:var(--accent);font-weight:900;min-height:25px}
.wordMain{font-family:var(--serif);font-size:clamp(46px,9vw,82px);font-style:italic;line-height:.95}
.wordSub{margin-top:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.18em;font-family:var(--mono)}
.phase{text-align:center;color:var(--brand);font-family:var(--mono);font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:18px 0}
.artGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.artBtn,.opt{border:2px solid var(--line);background:var(--panel2);border-radius:22px;padding:24px;font-weight:900;font-size:30px}
.artBtn:hover,.opt:hover{border-color:var(--brand)}
.opt{font-size:18px;text-align:left;width:100%;margin-bottom:10px}
.answerInput{font-size:26px;text-align:center}
.feedback{margin-top:14px;border-radius:18px;padding:14px;font-weight:800}
.feedback.ok{background:rgba(22,136,90,.12);color:var(--good);border:1px solid rgba(22,136,90,.25)}
.feedback.err{background:rgba(197,60,60,.12);color:var(--bad);border:1px solid rgba(197,60,60,.25)}
.diagnosis{margin-top:10px;border-radius:18px;padding:14px;background:rgba(255,190,92,.18);color:var(--ink);border:1px solid rgba(255,190,92,.3)}
.nextRow{display:flex;justify-content:center;margin-top:16px}
.gap{font-family:var(--serif);font-size:30px;line-height:1.3;text-align:center;padding:22px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);margin-bottom:14px}
.blank{border-bottom:3px solid var(--accent);padding:0 28px;color:var(--accent)}
.learnBox{background:linear-gradient(135deg,rgba(17,100,102,.10),rgba(255,107,74,.08));border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center}
.learnPattern{font-family:var(--serif);font-size:34px;color:var(--brand2);margin-bottom:10px}.dark .learnPattern{color:var(--brand)}
.learnMeta{color:var(--muted);font-family:var(--mono);font-size:13px;line-height:1.6}
.learnEx{font-family:var(--serif);font-size:25px;font-style:italic;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.resource{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
@media(max-width:1180px){.app{grid-template-columns:1fr}.side{display:none}.moduleGrid{grid-template-columns:repeat(2,1fr)}.configGrid,.gridStats{grid-template-columns:1fr 1fr}.resources{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.main{padding:18px}.moduleGrid,.configGrid,.gridStats,.resources{grid-template-columns:1fr}.artGrid{grid-template-columns:1fr 1fr}.qcard{padding:22px}.title h2{font-size:44px}.quizTop{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 0}.chip{font-size:11px;padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logoMark">DT</div><h1>Deutsch<br>Trainer</h1></div>
    <nav class="nav">
      <button class="on" data-screen="menu">⌂ Dashboard</button>
      <button data-screen="tracker">◎ Fortschritt</button>
      <button id="openResourcesSide">⚙ Ressourcen</button>
    </nav>
    <div class="streak"><strong id="sideStreak">0</strong><div id="sideStreakLabel">sessions completed</div></div>
  </aside>
  <main class="main">
    <section id="menu" class="screen on">
      <div class="top">
        <div class="title"><h2>Deutsch Trainer</h2><p id="subtitle">Vocabulary · Grammar · Active Recall</p></div>
        <div class="actions">
          <button class="btn" id="themeBtn">Theme</button>
          <button class="btn" id="resourceBtn">Resources</button>
        </div>
      </div>
      <div class="gridStats">
        <div class="stat"><b id="stItems">0</b><span>items loaded</span></div>
        <div class="stat"><b id="stAcc">—</b><span>accuracy</span></div>
        <div class="stat"><b id="stWeak">0</b><span>weak items</span></div>
        <div class="stat"><b id="stDue">0</b><span>due today</span></div>
      </div>
      <div class="moduleGrid" id="moduleGrid"></div>
      <div class="config">
        <div class="configGrid">
          <div><label>Interface & quiz language</label><select id="langSelect"></select></div>
          <div><label>Chapter / set</label><select id="setSelect"></select></div>
          <div><label>Practice mode</label><select id="modeSelect"></select></div>
          <div><label>Items per session</label><div class="pills" id="sizePills"><button class="pill" data-n="5">5</button><button class="pill" data-n="10">10</button><button class="pill on" data-n="20">20</button><button class="pill" data-n="all">All</button></div></div>
        </div>
        <div class="startRow">
          <button class="btn" id="weakBtn">Weak review</button>
          <button class="btn primary" id="startBtn">Start practising</button>
          <button class="btn" id="trackerBtn">Tracker</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </section>
    <section id="quiz" class="screen">
      <div class="quizWrap">
        <div class="quizTop">
          <div class="chips"><span class="chip" id="qModule"></span><span class="chip" id="qOk">0 ✓</span><span class="chip" id="qErr">0 ✗</span><span class="chip" id="qLeft">0 left</span></div>
          <div class="actions"><button class="btn" id="speakBtn">🔊</button><button class="btn" id="skipBtn">Skip</button><button class="btn" id="exitBtn">Exit</button></div>
        </div>
        <div class="quizCenter"><div class="qcard" id="qcard"></div></div>
      </div>
    </section>
    <section id="summary" class="screen"><div class="panel"><h2 class="logoTitle" id="sumScore"></h2><p id="sumSub"></p><div id="sumWeak"></div><div class="startRow"><button class="btn primary" id="reviewBtn">Review weak</button><button class="btn" id="repeatBtn">Same session</button><button class="btn" data-screen="menu">Menu</button></div></div></section>
    <section id="tracker" class="screen"><div class="top"><div class="title"><h2>Tracker</h2><p>Skill-level progress, not just item-level points.</p></div><button class="btn" data-screen="menu">Back</button></div><div class="panel" id="trackerBox"></div></section>
    <section id="resources" class="screen"><div class="top"><div class="title"><h2>Resources</h2><p>Useful German grammar and dictionary links.</p></div><button class="btn" data-screen="menu">Back</button></div><div class="resources" id="resourcesGrid"></div></section>
  </main>
</div>
<script>
'use strict';
window.VOKABULAR_BUILD='quality-redesign-reviewed-2026-05-29';

const LANGS=['English','German','French','Spanish','Italian','Portuguese','Chinese','Japanese','Korean','Arabic','Persian','Thai'];
const T={
 English:{subtitle:'Vocabulary · Grammar · Active Recall',start:'Start practising',weak:'Weak review',items:'items loaded',acc:'accuracy',weakItems:'weak items',due:'due today',continue:'Continue',correct:'Correct',wrong:'Wrong',expected:'Expected'},
 German:{subtitle:'Vokabular · Grammatik · Active Recall',start:'Übung starten',weak:'Schwächen üben',items:'Items geladen',acc:'Genauigkeit',weakItems:'schwache Items',due:'heute fällig',continue:'Weiter',correct:'Richtig',wrong:'Falsch',expected:'Erwartet'},
 French:{subtitle:'Vocabulaire · Grammaire · Rappel actif',start:'Commencer',weak:'Réviser les faiblesses',items:'items chargés',acc:'précision',weakItems:'items faibles',due:'à revoir',continue:'Continuer',correct:'Correct',wrong:'Faux',expected:'Attendu'},
 Spanish:{subtitle:'Vocabulario · Gramática · Recuerdo activo',start:'Empezar',weak:'Repasar débiles',items:'items cargados',acc:'precisión',weakItems:'items débiles',due:'para hoy',continue:'Continuar',correct:'Correcto',wrong:'Incorrecto',expected:'Esperado'}
};
function tr(k){return (T[USER.lang]&&T[USER.lang][k])||T.English[k]||k}
const MODULES={
 vocab:{id:'vocab',n:1,title:'Kapitel vocabulary',subtitle:'articles · meanings · plurals · active recall',icon:'📖',modes:['full','article','meaning','plural','active','sentence'],default:'full'},
 prepverbs:{id:'prepverbs',n:2,title:'Präpositionalverben',subtitle:'preposition · case · pattern recall',icon:'↻',modes:['prep_full','prep_gap','prep_case','prep_meaning'],default:'prep_full'},
 kasusergaenzungen:{id:'kasusergaenzungen',n:3,title:'Kasusergänzungen',subtitle:'Akkusativ · Dativ · double objects',icon:'▤',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 starke_verben:{id:'starke_verben',n:4,title:'Starke Verben',subtitle:'Präteritum · Partizip II · auxiliary',icon:'ϟ',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 trennbare_verben:{id:'trennbare_verben',n:5,title:'Trennbare Verben',subtitle:'prefix split · Perfekt · sentence order',icon:'⇄',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 praepositionen:{id:'praepositionen',n:6,title:'Präpositionen',subtitle:'Akkusativ · Dativ · Genitiv · Wechsel',icon:'⌖',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 nomen_artikel_plural:{id:'nomen_artikel_plural',n:7,title:'Nomen · Artikel · Plural',subtitle:'gender · plural · n-declension',icon:'A',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 adjektivdeklination:{id:'adjektivdeklination',n:8,title:'Adjektivdeklination',subtitle:'strong · weak · mixed endings',icon:'Aa',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 pronomen:{id:'pronomen',n:9,title:'Pronomen',subtitle:'Akkusativ · Dativ · reflexive · possessive',icon:'○',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'},
 konnektoren_nebensaetze:{id:'konnektoren_nebensaetze',n:10,title:'Konnektoren / Nebensätze',subtitle:'weil · obwohl · deshalb · word order',icon:'∞',modes:['grammar_full','grammar_prompt','grammar_meaning'],default:'grammar_full'}
};
const MODE={full:'Full cycle',article:'Article only',meaning:'Meaning only',plural:'Plural only',active:'Active recall',sentence:'Sentence gaps',prep_full:'Full grammar cycle',prep_gap:'Preposition gaps',prep_case:'Case recall',prep_meaning:'Meaning only',grammar_full:'Full module cycle',grammar_prompt:'Prompt practice',grammar_meaning:'Meaning only'};
const STORE='dwipa_quality_db_v1', PROG='dwipa_quality_prog_v1', USERKEY='dwipa_quality_user_v1';
let DB=load(STORE,{modules:{}}), P=load(PROG,{progress:{},history:[]}), USER=load(USERKEY,{module:'vocab',set:'all',mode:'full',lang:'English',size:'20'}), Q=null;
function $(id){return document.getElementById(id)}
function load(k,f){try{return Object.assign(JSON.parse(JSON.stringify(f)),JSON.parse(localStorage.getItem(k)||'{}'))}catch{return JSON.parse(JSON.stringify(f))}}
function save(){localStorage.setItem(STORE,JSON.stringify(DB));localStorage.setItem(PROG,JSON.stringify(P));localStorage.setItem(USERKEY,JSON.stringify(USER))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').toLowerCase().replaceAll('ä','ae').replaceAll('ö','oe').replaceAll('ü','ue').replaceAll('ß','ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensure(){Object.keys(MODULES).forEach(id=>DB.modules[id]=DB.modules[id]||{items:[],sets:['all']});if(!MODULES[USER.module])USER.module='vocab';if(!MODULES[USER.module].modes.includes(USER.mode))USER.mode=MODULES[USER.module].default}
function artOf(x){return String(x.word||x.display||'').match(/^(der|die|das)\s+/i)?.[1]?.toLowerCase()||null}
function baseOf(x){return String(x.word||x.display||x.lemma||'').replace(/^(der|die|das)\s+/i,'').split(',')[0].trim()}
function trOf(x){let t=x.data?.translations||x.meaning||{};return t[USER.lang]||t.English||t.German||Object.values(t).find(Boolean)||'—'}
function answersOf(x){return x.answers||[x.answer].filter(Boolean)}
function key(x,skill='general'){return `${x.module}:${x.id}:${skill}`}
function prog(x,skill='general'){let k=key(x,skill);return P.progress[k]||(P.progress[k]={c:0,w:0,box:0,due:0})}
function record(x,ok,skill){let r=prog(x,skill);ok?(r.c++,r.box=Math.min(7,r.box+1)):(r.w++,r.box=0);r.due=Date.now()+[0,1,3,7,14,30,60,120][r.box]*86400000;save()}
function items(){let arr=DB.modules[USER.module]?.items||[];if(USER.module==='vocab'&&USER.set!=='all')arr=arr.filter(x=>String(x.chapter||x.set)===USER.set);return arr}
function weakItems(){return items().filter(x=>Object.entries(P.progress).some(([k,r])=>k.startsWith(`${x.module}:${x.id}:`)&&r.w>r.c))}
function dueItems(){return items().filter(x=>Object.entries(P.progress).some(([k,r])=>k.startsWith(`${x.module}:${x.id}:`)&&r.due<=Date.now()))}
async function loadAll(){ensure();$('status').textContent='Loading learning content…';await loadVocab();await loadGrammar();save();render();$('status').textContent=`Ready · ${Object.values(DB.modules).reduce((a,m)=>a+(m.items||[]).length,0)} learning items loaded.`}
async function loadVocab(){let its=[],sets=[];for(let i=1;i<=20;i++){try{let r=await fetch(`vokabular/kapitel${i}.json`,{cache:'no-store'});if(!r.ok)continue;let j=await r.json();(j.words||[]).forEach(w=>its.push({...w,module:'vocab',set:String(i),chapter:String(i),id:w.id||`k${i}_${its.length}`}));sets.push(String(i))}catch{}}DB.modules.vocab={items:its,sets}}
async function loadGrammar(){for(let id of Object.keys(MODULES).filter(x=>x!=='vocab')){try{let r=await fetch(`grammatik/${id==='prepverbs'?'praepositionalverben':id}.json`,{cache:'no-store'});if(!r.ok)continue;let j=await r.json();DB.modules[id]={items:(j.items||[]).map(x=>normGrammar(x,id)),sets:['all']}}catch(e){console.warn(e)}}}
function normGrammar(x,id){return {...x,module:id,set:'all',word:x.display||x.lemma||x.prompt,id:x.id||`${id}_${Math.random().toString(36).slice(2)}`,data:{translations:x.meaning||{},grammar:{type:x.type,case:x.case},example_de:x.example?.de||''}}}
function render(){ensure();document.body.classList.toggle('dark',localStorage.getItem('theme')==='dark');$('subtitle').textContent=tr('subtitle');$('startBtn').textContent=tr('start');$('weakBtn').textContent=tr('weak');renderModules();renderControls();renderStats()}
function renderModules(){$('moduleGrid').innerHTML=Object.values(MODULES).map(m=>{let count=DB.modules[m.id]?.items?.length||0;return `<button class="module ${USER.module===m.id?'on':''}" data-module="${m.id}"><span class="num">${m.n.toString().padStart(2,'0')}</span><span class="badge">Active</span><div class="ico">${m.icon}</div><h3>${esc(m.title)}</h3><p>${esc(m.subtitle)}</p><small>${count} items</small></button>`}).join('')}
function renderControls(){$('langSelect').innerHTML=LANGS.map(l=>`<option ${USER.lang===l?'selected':''}>${l}</option>`).join('');$('setSelect').innerHTML=USER.module==='vocab'?`<option value="all">All chapters</option>`+(DB.modules.vocab?.sets||[]).map(s=>`<option value="${s}" ${USER.set===s?'selected':''}>Kapitel ${s}</option>`).join(''):`<option value="all">All items</option>`;$('setSelect').disabled=USER.module!=='vocab';$('modeSelect').innerHTML=MODULES[USER.module].modes.map(m=>`<option value="${m}" ${USER.mode===m?'selected':''}>${MODE[m]}</option>`).join('');document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.n===USER.size))}
function renderStats(){let arr=items(), ps=Object.values(P.progress), att=ps.reduce((a,r)=>a+r.c+r.w,0), cor=ps.reduce((a,r)=>a+r.c,0);$('stItems').textContent=arr.length;$('stAcc').textContent=att?Math.round(cor/att*100)+'%':'—';$('stWeak').textContent=weakItems().length;$('stDue').textContent=dueItems().length;$('sideStreak').textContent=(P.history||[]).length}
function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');if(id==='tracker')renderTracker();if(id==='resources')renderResources()}
function buildQueue(selected){if(USER.module==='prepverbs'&&USER.mode==='prep_full')return selected.flatMap(item=>[{item,type:'prep_learn'},{item,type:'meaning'},{item,type:'prep_gap'},{item,type:'prep_case'}]);if(USER.module!=='vocab'&&USER.module!=='prepverbs'&&USER.mode==='grammar_full')return selected.flatMap(item=>[{item,type:'grammar_learn'},{item,type:'meaning'},{item,type:'grammar_prompt'}]);return selected.map(item=>({item,type:null}))}
function start(pool=null){let p=pool||items();if(!p.length){alert('No items loaded for this module.');return}let n=USER.size==='all'?p.length:Math.min(Number(USER.size||20),p.length);let chosen=shuffle(p).slice(0,n);Q={queue:buildQueue(chosen),original:chosen,i:0,ok:0,err:0,pts:0,weak:[],best:0,streak:0,answered:false};screen('quiz');next()}
function weakReview(){let w=weakItems();if(!w.length){alert('No weak items yet.');return}start(w)}
function next(){if(Q.i>=Q.queue.length)return finish();Q.answered=false;let e=Q.queue[Q.i];Q.cur=e.item;Q.q=question(e.item,e.type);renderQuestion()}
function question(x,forced){if(forced)return {type:forced};if(USER.module==='vocab'){if(USER.mode==='full'){if(artOf(x))return{type:'article'};return{type:'meaning'}}return{type:USER.mode}}if(USER.module==='prepverbs'){return {type:{prep_full:'prep_learn',prep_gap:'prep_gap',prep_case:'prep_case',prep_meaning:'meaning'}[USER.mode]||'prep_learn'}}return{type:USER.mode==='grammar_meaning'?'meaning':'grammar_prompt'}}
function titleFor(x,q){if(x.module==='vocab'){if(q.type==='article')return baseOf(x);if(q.type==='plural')return x.data?.grammar?.base||baseOf(x);if(q.type==='active')return trOf(x);if(q.type==='sentence')return MODULES.vocab.title;return baseOf(x)}if(x.module==='prepverbs'){if(q.type==='meaning'||q.type==='prep_learn')return x.lemma||baseOf(x);return 'Präpositionalverb'}if(q.type==='meaning')return x.display;return MODULES[x.module].title}
function subFor(x,q){if(x.module==='vocab')return q.type==='active'?'recall the German word':(x.notes||'');if(x.module==='prepverbs')return q.type==='prep_gap'?'fill the missing preposition':q.type==='prep_case'?'recall the case':'learn first, then practise';return q.type==='grammar_prompt'?(x.case||'answer without seeing the pattern'):'learn first, then practise'}
function artDisplay(x,q){if(q.type==='article')return '?';if(q.type==='plural')return '';return artOf(x)||''}
function renderQuestion(){let x=Q.cur,q=Q.q;$('qModule').textContent=MODULES[USER.module].title;$('qOk').textContent=`${Q.ok} ✓`;$('qErr').textContent=`${Q.err} ✗`;$('qLeft').textContent=`${Q.queue.length-Q.i} left`;let out=`<div class="word"><div class="wordArt">${esc(artDisplay(x,q))}</div><div class="wordMain">${esc(titleFor(x,q))}</div><div class="wordSub">${esc(subFor(x,q))}</div></div>`;if(q.type==='article')out+=articleView();else if(q.type==='meaning')out+=meaningView(x);else if(q.type==='plural')out+=inputView('Plural');else if(q.type==='active')out+=inputView('Active recall');else if(q.type==='sentence')out+=sentenceView(x);else if(q.type==='prep_learn')out+=prepLearn(x);else if(q.type==='prep_gap')out+=prepGap(x);else if(q.type==='prep_case')out+=inputView('Case recall');else if(q.type==='grammar_learn')out+=learnView(x);else if(q.type==='grammar_prompt')out+=promptView(x);$('qcard').innerHTML=out;let inp=$('answerInput');if(inp)setTimeout(()=>inp.focus(),0)}
function articleView(){return `<div class="phase">Choose article</div><div class="artGrid">${['der','die','das','—'].map(a=>`<button class="artBtn" data-answer="${a}">${a}</button>`).join('')}</div>`}
function meaningView(x){let correct=trOf(x), opts=shuffle([correct,...shuffle(items().filter(y=>y.id!==x.id).map(trOf).filter(v=>v&&v!==correct)).slice(0,3)]);return `<div class="phase">Choose meaning</div>${opts.map(o=>`<button class="opt" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}`}
function inputView(label){return `<div class="phase">${esc(label)}</div><input class="answerInput" id="answerInput" autocomplete="off"><div class="startRow"><button class="btn primary" id="checkBtn">Check</button></div>`}
function sentenceView(x){let b=baseOf(x), ex=x.data?.example_de||`Ich lerne ${b}.`, sent=ex.includes(b)?ex.replace(b,'___'):ex+' ___';Q.sentenceAnswer=b;return `<div class="phase">Sentence gap</div><div class="gap">${esc(sent).replace('___','<span class="blank">___</span>')}</div>`+inputView('')}
function prepLearn(x){return `<div class="phase">Learn pattern</div><div class="learnBox"><div class="learnPattern">${esc(x.display)}</div><div class="learnMeta">Meaning: ${esc(trOf(x))}<br>Preposition: ${esc(x.preposition)} · Case: ${esc(x.case)}</div><div class="learnEx">${esc(x.example?.de||'')}</div></div><div class="nextRow"><button class="btn primary" id="learnNext">Continue</button></div>`}
function prepGap(x){return `<div class="phase">Preposition gap</div><div class="gap">${esc(x.gap?.sentence||'').replace('___','<span class="blank">___</span>')}</div>`+inputView('')}
function learnView(x){return `<div class="phase">Learn item</div><div class="learnBox"><div class="learnPattern">${esc(x.display)}</div><div class="learnMeta">Meaning: ${esc(trOf(x))}<br>Focus: ${esc(x.case||x.type||'')}</div><div class="learnEx">${esc(x.example?.de||'')}</div></div><div class="nextRow"><button class="btn primary" id="learnNext">Continue</button></div>`}
function promptView(x){return `<div class="phase">Practice</div><div class="gap">${esc(x.prompt_clean||x.prompt||'').replace('___','<span class="blank">___</span>')}</div>`+inputView('')}
function expected(){let x=Q.cur,t=Q.q.type;if(t==='article')return[artOf(x)||'—'];if(t==='meaning')return[trOf(x)];if(t==='plural')return [x.data?.grammar?.plural,x.data?.grammar?.plural_hint].filter(Boolean);if(t==='active')return[x.word,baseOf(x)].filter(Boolean);if(t==='sentence')return[Q.sentenceAnswer];if(t==='prep_gap')return[x.preposition];if(t==='prep_case')return[x.case,(x.case==='Akkusativ'?'Akk':'Dat')];if(t==='grammar_prompt')return answersOf(x);return['continue']}
function answer(v){if(!Q||Q.answered)return;let ex=expected(), ok=ex.some(a=>norm(a)===norm(v)||acceptableVariant(norm(a),norm(v)));Q.answered=true;if(ok){Q.ok++;Q.streak++;Q.best=Math.max(Q.best,Q.streak);Q.pts+=2}else{Q.err++;Q.streak=0;Q.weak.push(Q.cur)}record(Q.cur,ok,Q.q.type);feedback(ok,ex[0],v)}
function acceptableVariant(a,v){if(!a||!v)return false;if(v.includes(a)&&a.length>3)return true;return false}
function feedback(ok,exp,val){$('qcard').insertAdjacentHTML('beforeend',`<div class="feedback ${ok?'ok':'err'}">${ok?tr('correct'):tr('wrong')} · ${tr('expected')}: ${esc(exp||'—')}</div>`);if(!ok)$('qcard').insertAdjacentHTML('beforeend',`<div class="diagnosis">${diagnose(Q.q.type,Q.cur,exp,val)}</div>`);$('qcard').insertAdjacentHTML('beforeend',`<div class="nextRow"><button class="btn primary" id="nextBtn">${tr('continue')}</button></div>`)}
function diagnose(t,x,exp,val){if(t==='article')return `Article recall: the correct article is ${exp}.`;if(t==='plural')return `Plural recall: learn the full plural form.`;if(t==='prep_gap')return `${x.lemma||'This verb'} uses “${x.preposition} + ${x.case}”.`;if(t==='prep_case')return `Case recall: ${x.display} uses ${x.case}.`;if(t==='grammar_prompt')return `Pattern practice. Focus: ${x.case||x.type||'grammar'}.`;return `Your answer: ${val||'—'}.`}
function cont(){Q.i++;next()}
function skip(){Q.err++;Q.weak.push(Q.cur);record(Q.cur,false,Q.q?.type||'skip');Q.i++;next()}
function finish(){P.history.push({date:new Date().toISOString(),module:USER.module,ok:Q.ok,err:Q.err,pts:Q.pts});save();$('sumScore').textContent=Math.round(Q.ok/Math.max(1,Q.ok+Q.err)*100)+'%';$('sumSub').textContent=`${Q.ok} correct · ${Q.err} weak · best streak ${Q.best}`;$('sumWeak').innerHTML=Q.weak.length?`<table><tr><th>Weak item</th><th>Meaning</th></tr>${[...new Map(Q.weak.map(x=>[x.id,x])).values()].map(x=>`<tr><td>${esc(x.display||x.word)}</td><td>${esc(trOf(x))}</td></tr>`).join('')}</table>`:'';screen('summary');render()}
function renderTracker(){let rows=Object.entries(P.progress).map(([k,r])=>`<tr><td>${esc(k)}</td><td>${r.c}</td><td>${r.w}</td><td>${r.box}</td></tr>`).join('');$('trackerBox').innerHTML=`<table><tr><th>Skill</th><th>Correct</th><th>Wrong</th><th>Box</th></tr>${rows}</table>`}
function renderResources(){let rs=[['Duden','https://www.duden.de/'],['DWDS','https://www.dwds.de/'],['Verbformen','https://www.verbformen.de/'],['Mein Deutschbuch','https://mein-deutschbuch.de/grammatik.html'],['Schubert Verlag','https://www.schubert-verlag.de/aufgaben/'],['DW Learn German','https://learngerman.dw.com/']];$('resourcesGrid').innerHTML=rs.map(([n,u])=>`<div class="resource"><h3>${n}</h3><a target="_blank" href="${u}">${u}</a></div>`).join('')}
function speak(){if(!Q?.cur||!speechSynthesis)return;let u=new SpeechSynthesisUtterance(titleFor(Q.cur,Q.q));u.lang='de-DE';speechSynthesis.cancel();speechSynthesis.speak(u)}
document.addEventListener('click',e=>{let mod=e.target.closest('[data-module]');if(mod){USER.module=mod.dataset.module;USER.mode=MODULES[USER.module].default;USER.set='all';save();render()}let sc=e.target.closest('[data-screen]');if(sc)screen(sc.dataset.screen);let ans=e.target.closest('[data-answer]');if(ans)answer(ans.dataset.answer);if(e.target.id==='checkBtn')answer($('answerInput')?.value||'');if(e.target.id==='nextBtn'||e.target.id==='learnNext')cont();});
$('startBtn').onclick=()=>start();$('weakBtn').onclick=()=>weakReview();$('trackerBtn').onclick=()=>screen('tracker');$('resourceBtn').onclick=()=>screen('resources');$('openResourcesSide').onclick=()=>screen('resources');$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')};$('skipBtn').onclick=()=>skip();$('exitBtn').onclick=()=>screen('menu');$('speakBtn').onclick=()=>speak();$('reviewBtn').onclick=()=>weakReview();$('repeatBtn').onclick=()=>start(Q?.original||items());
$('langSelect').onchange=e=>{USER.lang=e.target.value;save();render()};$('setSelect').onchange=e=>{USER.set=e.target.value;save();render()};$('modeSelect').onchange=e=>{USER.mode=e.target.value;save();render()};$('sizePills').onclick=e=>{let p=e.target.closest('.pill');if(!p)return;USER.size=p.dataset.n;save();render()};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('answerInput')&&!Q?.answered)answer($('answerInput').value)});
(async()=>{ensure();if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');render();await loadAll()})();
</script>
