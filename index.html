<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabular · Mastery Edition</title>
<style>
    body { background: #08080a; color: #e8e0d0; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #render-error { color: #e74c3c; padding: 20px; border: 1px solid #e74c3c; border-radius: 8px; }
</style>
</head>
<body>

<div id="app-root">
    </div>
<div id="render-error" style="display:none;"></div>

<script>
    // 1. Force Reset Storage if version mismatch
    if (localStorage.getItem('vok_v9') !== 'true') {
        localStorage.clear();
        localStorage.setItem('vok_v9', 'true');
    }

    // 2. Minimal Data Structure (Essential for rendering)
    const W = { words: [
        { id: "k1_001", word: "die Messe", notes: "Kapitel 1", status: "done", data: { translations: { English: "trade fair" }, explanation: "A large exhibition.", example_de: "Wir besuchen die Buchmesse.", example_translated: "We are visiting the fair.", grammar: { type: "noun", singular: "die Messe", plural: "die Messen" } } }
    ]};

    // 3. Simple Render Test
    try {
        const root = document.getElementById('app-root');
        root.innerHTML = `
            <div style="text-align:center;">
                <h1 style="color:#c9a84c;">Vokabular Engine</h1>
                <p>System is online. Words detected: ${W.words.length}</p>
                <button onclick="location.reload()" style="padding:10px; margin-top:20px; cursor:pointer;">Reload App</button>
            </div>
        `;
    } catch(e) {
        const err = document.getElementById('render-error');
        err.style.display = 'block';
        err.textContent = "Critical Render Error: " + e.message;
    }
</script>
</body>
</html>
