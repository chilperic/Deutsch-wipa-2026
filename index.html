<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vokabular · Mastery Edition</title>
</head>
<body>
    <div id="app-root"><h1>Initializing Engine...</h1></div>

<script>
async function init() {
    try {
        // Change './kapitel1.json' to './data/kapitel1.json' ONLY if you put them in a folder
        const response = await fetch('./kapitel1.json'); 
        if (!response.ok) throw new Error("Could not find kapitel1.json in the repository root.");
        
        const data = await response.json();
        
        // Success!
        document.getElementById('app-root').innerHTML = `
            <h1 style="color:#c9a84c;">Vokabular Engine</h1>
            <p style="color:green;">Success! Loaded ${data.length} words from Kapitel 1.</p>
        `;
    } catch(err) {
        document.getElementById('app-root').innerHTML = `
            <h1 style="color:red;">Fatal Error</h1>
            <p>${err.message}</p>
            <p>Make sure 'kapitel1.json' is in the same folder as 'index.html'.</p>
        `;
    }
}
init();
</script>
</body>
</html>
