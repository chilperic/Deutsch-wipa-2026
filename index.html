<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabular · Mastery Edition</title>
</head>
<body>

<div id="app-root">
    </div>

<script>
// --- PROFESSIONAL DATA ENGINE ---
let W = { words: [] };

async function loadChapter(chapterName) {
    try {
        // This looks inside the 'data' folder for your specific chapter file
        const response = await fetch(`./data/${chapterName}.json`);
        if (!response.ok) throw new Error("Chapter file not found");
        const data = await response.json();
        W.words = data; // Set the current words to this chapter's data
        buildDashboard();
    } catch(err) {
        alert("Error loading chapter: " + err.message);
    }
}

// Update the select dropdown in your Dashboard to trigger this
document.getElementById('sel-chapter').onchange = (e) => {
    loadChapter(e.target.value);
};

// --- INITIALIZATION ---
window.onload = () => {
    loadChapter('kapitel1'); // Load chapter 1 by default
};
</script>
</body>
</html>
