<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vokabular · Mastery Edition</title>
    <style>
        body { background: #08080a; color: #e8e0d0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .ui { text-align: center; border: 1px solid #28282f; padding: 40px; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="app" class="ui"><h1>Launching Engine...</h1></div>

<script>
// THIS IS YOUR MASTER DATABASE
const MASTER_DATA = {
    "k1": [
        { "id": "k1_001", "word": "die Messe", "data": { "translations": {"Persian": "نمایشگاه"}, "grammar": {"singular": "die Messe", "plural": "die Messen"} } }
    ],
    "k2": [
        { "id": "k2_001", "word": "die Prüfung", "data": { "translations": {"Persian": "امتحان"}, "grammar": {"singular": "die Prüfung", "plural": "die Prüfungen"} } }
    ]
};

// INITIALIZATION
try {
    // Flatten all chapters into one array for the engine
    const allWords = Object.values(MASTER_DATA).flat();
    document.getElementById('app').innerHTML = `
        <h1 style="color:#c9a84c;">Vokabular Mastery Edition</h1>
        <p style="color:#2ecc71;">Data engine initialized.</p>
        <p>Words loaded: ${allWords.length}</p>
        <button onclick="location.reload()" style="padding:10px;">Launch Quiz</button>
    `;
    console.log("Success! Data loaded:", allWords);
} catch(e) {
    document.getElementById('app').innerHTML = `<h1>Fatal Error</h1><p>${e.message}</p>`;
}
</script>
</body>
</html>
