<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vokabular · Mastery Edition</title>
    <style>
        :root { --bg: #08080a; --gold: #c9a84c; --text: #e8e0d0; --bdr: #28282f; --gray: #7a7268; }
        body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 500px; border: 1px solid var(--bdr); padding: 30px; border-radius: 12px; }
        h1 { color: var(--gold); border-bottom: 1px solid var(--bdr); padding-bottom: 10px; }
        .section { margin-top: 25px; }
        h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; }
        button { background: var(--gold); color: #000; border: none; padding: 10px; margin-top: 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="app">
    <h1>Vokabular Engine</h1>
    <div id="content">Loading complex data structures...</div>
</div>

<script>
// PRO-LEVEL DATA STRUCTURE
const DB = [
    {
        "word": "wettbewerbsfähig",
        "grammar": "Capable of competing successfully.",
        "example_de": "„Um wettbewerbsfähig zu bleiben, müssen wir die Kosten senken.“",
        "example_en": "To remain competitive, we must reduce costs.",
        "translations": {
            "English": "competitive", "French": "compétitif", "Arabic": "تنافسي",
            "Persian": "رقابت‌پذیر", "Spanish": "competitivo", "Ukrainian": "конкурентоспроможний",
            "Russian": "конкурентоспособный", "Italian": "competitivo", "Swahili": "enye ushindani"
        }
    }
];

function render(word) {
    const content = document.getElementById('content');
    const translations = Object.entries(word.translations).map(([lang, val]) => 
        `<div><b>${lang}:</b> ${val}</div>`).join('');

    content.innerHTML = `
        <h1 style="border:none;">${word.word}</h1>
        <div class="section">
            <h3>Grammar & Context</h3>
            <p>${word.grammar}</p>
        </div>
        <div class="section">
            <h3>Example Sentence</h3>
            <p><em>${word.example_de}</em><br>${word.example_en}</p>
        </div>
        <div class="section">
            <h3>All Translations</h3>
            <div class="lang-grid">${translations}</div>
        </div>
        <button onclick="location.reload()">Next Word</button>
    `;
}

render(DB[0]);
</script>
</body>
</html>
