<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabular · Deutsch lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{  
  --bg:#08080a; --s1:#111115; --s2:#17171c; --s3:#1e1e25;  
  --bdr:#28282f; --bdr2:#333340;  
  --gold:#c9a84c; --gold2:#8a6f30; --gold3:#f0c96a;  
  --text:#e8e0d0; --dim:#7a7268; --muted:#4a4840; --dead:#2a2820;  
  --ok:#2ecc71; --ok2:#1a8a4a; --ok-bg:rgba(46,204,113,.1);  
  --err:#e74c3c; --err2:#a33; --err-bg:rgba(231,76,60,.1);  
  --warn:#e67e22; --info:#3498db;  
  --serif:'Cormorant Garamond',Georgia,serif;  
  --body:'Crimson Pro',Georgia,serif;  
  --mono:'JetBrains Mono',monospace;  
  --r:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.screen.on{display:flex}
.logo{font-family:var(--serif);font-size:36px;color:var(--gold);font-weight:400;letter-spacing:.02em; text-align: center;}
.tagline{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:4px; text-align: center;}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2);margin-bottom:6px;display:block}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:12px;padding:32px;width:100%;max-width:480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
.card-gold{border-top:3px solid var(--gold)}
input[type=text],input[type=password],select{  
  width:100%;background:var(--s2);border:1px solid var(--bdr);color:var(--text);  
  padding:10px 14px;font-family:var(--body);font-size:16px;border-radius:var(--r); outline:none; transition: all 0.2s;
}
input:focus,select:focus{border-color:var(--gold2); box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.2);}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;border-radius:var(--r);padding:12px 20px;transition:all .2s font-weight:500;}
.btn-gold{background:var(--gold);color:#1a1200}.btn-gold:hover{filter:brightness(1.15); transform: translateY(-1px);}.btn-gold:disabled{background:var(--gold2);opacity:.5;cursor:not-allowed; transform: none;}
.btn-outline{background:transparent;color:var(--dim);border:1px solid var(--bdr)}.btn-outline:hover{border-color:var(--gold2);color:var(--text)}
.btn-block{display:block;width:100%}.btn-row{display:flex;gap:8px}
.pill-grp{display:flex;gap:6px;flex-wrap:wrap}.pill{font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:20px;border:1px solid var(--bdr);cursor:pointer;color:var(--dim);background:var(--s2); transition: all 0.2s;}.pill.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
#prog-track{position:fixed;top:0;left:0;right:0;height:4px;background:var(--bdr);z-index:200}#prog-fill{height:100%;background:var(--gold);transition:width .4s ease;width:0}
#quiz-header{position:sticky;top:0;z-index:100;width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(8, 8, 10, 0.9); backdrop-filter: blur(8px); border-bottom:1px solid var(--bdr)}
.qh-score{display:flex;gap:16px;font-family:var(--mono);font-size:13px}.qh-right{display:flex;gap:12px;align-items:center}
.streak-badge{font-family:var(--mono);font-size:12px;color:var(--warn);padding:4px 12px;background: rgba(230,126,34,.1); border:1px solid rgba(230,126,34,.3);border-radius:20px}
.icon-btn{background:var(--s2);border:1px solid var(--bdr);color:var(--dim);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center; transition: all 0.2s;}
.icon-btn:hover{background: var(--s3); color: var(--gold);}
#quiz-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;width:100%}
.qcard{width:100%;max-width:600px;display:flex;flex-direction:column;gap:0}
.word-area{text-align:center;padding:30px 12px 24px}
.word-main{font-family:var(--serif);font-style:italic;font-size:clamp(42px,8vw,72px);color:var(--text);line-height:1.1}
.word-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.15em;text-transform:uppercase}
.phase-lbl{font-family:var(--mono);font-size:11px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;text-align:center; opacity: 0.8;}
.art-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;padding:0 4px; margin-bottom: 20px;}
.art-btn{padding:18px 8px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;font-family:var(--mono);font-size:20px;color:var(--text);text-align:center; transition: all 0.2s; font-weight: 500;}
.art-btn:hover:not(:disabled){background:var(--s3); border-color:var(--gold2); transform: translateY(-2px);}
.art-btn:disabled{cursor:default;}
.art-btn.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.art-btn.wrong{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.opt-list{display:flex;flex-direction:column;gap:10px;padding:0 4px}
.opt{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;font-family:var(--body);font-size:18px;color:var(--text); transition: all 0.2s;}
.opt:hover:not(:disabled):not(.correct):not(.wrong){background:var(--s3);border-color:var(--gold2); transform: translateX(4px);}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}.opt.wrong{background:var(--err-bg);border-color:var(--err)}
.opt-key{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:20px; font-weight: bold;}
.feedback{text-align:center;padding:16px 16px 8px;font-family:var(--mono);font-size:14px;min-height:44px}
.fb-ok{color:var(--ok)} .fb-err{color:var(--err)}
.next-btn{display:block;width:100%;margin-top:16px;padding:16px;background:var(--gold);color:#1a1200;border:none;border-radius:var(--r);font-family:var(--mono);font-size:13px;text-transform:uppercase;cursor:pointer; font-weight: bold;}
.expl-btn{padding:16px 20px;background:var(--s2);border:1px solid var(--bdr);color:var(--dim);border-radius:var(--r);cursor:pointer;font-family:var(--mono);font-size:12px;text-transform:uppercase;width:100%;margin-top:12px; transition: all 0.2s;}
.expl-btn:hover{background: var(--s3); color: var(--gold);}
.expl-panel{margin-top:12px;background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);}
.expl-section{padding:20px;border-bottom:1px solid var(--bdr)}
.expl-txt{font-size:16px;line-height:1.75;color:var(--dim)}
.expl-ex-de{font-style:italic;color:var(--text);font-size:16px}
.expl-ex-tr{color:var(--dim);font-size:14px;margin-top:6px}
.grammar-box{background:var(--s2);border:1px solid var(--bdr);border-radius:6px;padding:12px;margin-top:10px;}
.grammar-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--mono);font-size:13px;color:var(--text);}
.grammar-grid div{display:flex; justify-content:space-between; border-bottom:1px solid var(--bdr); padding-bottom:4px;}
.grammar-grid span:first-child{color:var(--dim);}
.link-row{display:flex;flex-wrap:wrap;gap:8px}
.dlink{font-family:var(--mono);font-size:11px;padding:6px 14px;background: var(--s2); border:1px solid var(--bdr);border-radius:20px;color:var(--dim);text-decoration:none; transition: all 0.2s;}
.dlink:hover{border-color:var(--gold2);color:var(--gold); background: var(--s3);}
.sum-hero{text-align:center;padding:30px 0 20px}.sum-score{font-family:var(--serif);font-size:84px;color:var(--gold);font-weight:300;line-height:1}.sum-pct{font-family:var(--mono);font-size:15px;color:var(--dim);margin-top:8px}.sum-name{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:4px}
.stat-chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.stat-chip{font-family:var(--mono);font-size:12px;padding:8px 16px;background: var(--s2); border-radius:20px;border:1px solid var(--bdr);color:var(--dim)}
.stat-chip span{color:var(--gold);margin-right:6px; font-weight: bold;}
.wrong-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto; padding-right: 5px;}
.wrong-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--s2);border-radius:var(--r);font-size:16px; border-left: 3px solid var(--err);}
.wrong-de{color:var(--text);font-family:var(--serif);font-style:italic; font-size: 18px;}.wrong-tr{color:var(--dim);font-size:15px}
#modal-bg, #lb-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:16px; backdrop-filter: blur(4px);}
#modal-bg.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--bdr);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:32px;display:flex;flex-direction:column;gap:20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;}
.modal-ttl{font-family:var(--serif);font-size:26px;color:var(--gold);}
.gen-prog{font-family:var(--mono);font-size:12px;color:var(--gold2);margin-top:8px}
hr{border:none;border-top:1px solid var(--bdr)}
.gap{display:flex;flex-direction:column;gap:12px}
.tip{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
.tip a{color:var(--gold2)}
#file-input{display:none}
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
.blink span { animation:blink 1.2s infinite; }
.blink span:nth-child(2){animation-delay:.2s}
.blink span:nth-child(3){animation-delay:.4s}
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.anim-slide { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>
<body>

<div id="prog-track"><div id="prog-fill"></div></div>

<div class="screen on" id="screen-onboard">
<div class="card card-gold anim-slide">
  <div style="margin-bottom:30px">
    <div class="logo">Vokabular</div>
    <div class="tagline">Deutsch lernen · Smart Quiz</div>
  </div>
  <div class="gap">
    <div>
      <span class="lbl">Your name</span>
      <input type="text" id="inp-name" placeholder="Enter your name" maxlength="30">
    </div>
    <div>
      <span class="lbl">I speak / Quiz language</span>
      <select id="sel-native"></select>
    </div>
    <div>
      <span class="lbl">Explanations in</span>
      <select id="sel-expl"></select>
    </div>
    <div>
      <span class="lbl">Chapter</span>
      <select id="sel-chapter"></select>
    </div>
    <div>
      <span class="lbl">Words per session</span>
      <div class="pill-grp" id="pill-size">
        <span class="pill" data-n="10">10</span>
        <span class="pill on" data-n="20">20</span>
        <span class="pill" data-n="30">30</span>
        <span class="pill" data-n="50">50</span>
        <span class="pill" data-n="all">All</span>
      </div>
    </div>
    <p class="tip" id="ob-info" style="text-align:center; padding: 10px 0;"></p>
    <button class="btn btn-gold btn-block" id="btn-start" onclick="startSession()" style="padding:16px;font-size:14px;margin-top:6px">▶ Start Game</button>
    <hr style="margin: 10px 0;">
    <div class="btn-row">
      <button class="btn btn-outline" style="flex:1" onclick="openSettings()">⚙ Manage Dictionary</button>
    </div>
  </div>
</div>
</div>

<div class="screen" id="screen-quiz" style="padding:0;justify-content:flex-start">
  <div id="quiz-header">
    <div class="qh-score">
      <span style="color:var(--ok)" id="qh-ok">0 ✓</span>
      <span style="color:var(--err)" id="qh-err">0 ✗</span>
      <span style="color:var(--dim)" id="qh-left"></span>
    </div>
    <div class="qh-right">
      <span class="streak-badge" id="streak-badge" style="display:none"></span>
      <button class="icon-btn" onclick="openSettings()">⚙</button>
      <button class="icon-btn" onclick="confirmExit()">✕</button>
    </div>
  </div>
  <div id="quiz-body">
    <div class="qcard" id="qcard"></div>
  </div>
</div>

<div class="screen" id="screen-summary">
<div class="card card-gold anim-slide" style="max-width:560px;width:100%">
  <div class="sum-hero">
    <div class="sum-name" id="sum-name"></div>
    <div class="sum-score" id="sum-score"></div>
    <div class="sum-pct" id="sum-pct"></div>
  </div>
  <div class="stat-chips" id="sum-chips"></div>
  <div id="sum-wrong-section" style="margin-top:16px">
    <span class="lbl">Words to review</span>
    <div class="wrong-list" id="sum-wrong-list"></div>
  </div>
  <div class="btn-row" style="margin-top:24px">
    <button class="btn btn-gold" style="flex:1" id="btn-review-wrong" onclick="reviewWrongWords()">↺ Review Mistakes</button>
    <button class="btn btn-outline" style="flex:1" onclick="backToMenu()">← Main Menu</button>
  </div>
</div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()">
<div class="modal anim-slide">
  <div class="modal-hdr">
    <span class="modal-ttl">Dictionary Engine</span>
    <button class="icon-btn" onclick="closeModal()">✕</button>
  </div>
  <div>
    <span class="lbl">Anthropic API Key</span>
    <input type="password" id="m-apikey" placeholder="sk-ant-…" oninput="saveKey()">
    <p class="tip">Stored strictly locally in browser memory.</p>
  </div>
  <hr>
  <div>
    <span class="lbl">Generate translations for</span>
    <div class="pill-grp" id="m-lang-chips"></div>
  </div>
  <hr>
  <div>
    <span class="lbl">Translation Status</span>
    <p style="font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:12px" id="m-stats"></p>
    <button class="btn btn-gold btn-block" id="m-gen-btn" onclick="generateAll()">Generate Missing Translations</button>
    <p class="gen-prog blink" id="m-prog" style="display:none;margin-top:10px"></p>
  </div>
  <hr>
  <div>
    <span class="lbl">Data Management</span>
    <div class="btn-row">
      <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('file-input').click()">↑ Import File</button>
      <button class="btn btn-outline" style="flex:1" onclick="exportJSON()">↓ Export File</button>
    </div>
  </div>
</div>
</div>

<input type="file" id="file-input" accept=".json" onchange="importFile(event)">

<script>
if (localStorage.getItem('vok_v6') !== 'true') {
  localStorage.clear();
  localStorage.setItem('vok_v6', 'true');
}

const LANGS = ['English','French','Arabic','Persian','Spanish','Ukrainian','Russian','Italian','Swahili','Portuguese','Dutch','Chinese','Japanese','Polish','Turkish'];
const RTL = new Set(['Arabic','Persian']);
const ARTICLES = ['der','die','das','—'];

function getLeoLang(nativeLang) {
  const map = { 'English':'ende', 'French':'frde', 'Spanish':'esde', 'Italian':'itde', 'Russian':'rude', 'Polish':'plde', 'Portuguese':'ptde', 'Chinese':'chde' };
  return map[nativeLang] || 'ende';
}

function extLinks(word, nativeLang) {
  const base = encodeURIComponent(String(word||'').replace(/^(die|der|das)\s+/i,'').split(',')[0].split('(')[0].trim());
  const leo = getLeoLang(nativeLang);
  return [
    {n:'Duden', u:`https://www.duden.de/suchen/dudenonline/${base}`},
    {n:'Leo', u:`https://dict.leo.org/${leo}/search?query=${base}`},
    {n:'DWDS', u:`https://www.dwds.de/?q=${base}`},
    {n:'Verbformen', u:`https://www.verbformen.de/?q=${base}`}
  ];
}

// BAKE PRE-TRANSLATED VOCABULARY DATA (WITH DEEP GRAMMAR!)
let W = {
  meta: { "targetLanguages": ["English","French","Arabic","Persian","Spanish","Ukrainian","Russian","Italian","Swahili"], "explanationLanguage": "English" },
  words: [
    {
      "id": "k1_001", "word": "das Essen", "notes": "Noun", "status": "done",
      "data": {
        "translations": { "English": "food / meal", "French": "nourriture / repas", "Arabic": "طعام", "Persian": "غذا", "Spanish": "comida", "Ukrainian": "їжа", "Russian": "еда", "Italian": "cibo", "Swahili": "chakula" }, 
        "explanation": "Refers to the act of eating or the meal itself. It is a nominalized verb (capitalized infinitive).", 
        "example_de": "Das Essen schmeckt hervorragend.", "example_translated": "The food tastes excellent.",
        "grammar": { "type": "noun", "singular": "das Essen", "plural": "die Essen", "related": "essen (verb)" }
      }
    },
    {
      "id": "k1_002", "word": "sich bewerben", "notes": "Verb · §1", "status": "done",
      "data": { 
        "translations": { "English": "to apply (for a job)", "French": "postuler", "Arabic": "يتقدم لوظيفة", "Persian": "درخواست کار دادن", "Spanish": "solicitar un empleo", "Ukrainian": "подавати заяву", "Russian": "подавать заявление", "Italian": "candidarsi", "Swahili": "kutuma maombi" }, 
        "explanation": "Reflexive verb. Requires 'um' + Akkusativ for the position, or 'bei' + Dativ for the company. Irregular (strong) verb.", 
        "example_de": "Sie bewirbt sich bei einer großen Agentur um eine Stelle.", "example_translated": "She is applying for a job at a large agency.",
        "grammar": { "type": "verb", "conjugation": { "ich": "bewerbe mich", "du": "bewirbst dich", "er/sie/es": "bewirbt sich", "wir": "bewerben uns", "ihr": "bewerbt euch", "sie/Sie": "bewerben sich" }, "related": "die Bewerbung (noun)" }
      }
    },
    {
      "id": "k1_003", "word": "die Einarbeitung", "notes": "Noun · §3", "status": "done",
      "data": { 
        "translations": { "English": "onboarding / orientation", "French": "intégration / formation initiale", "Arabic": "توجيه / تدريب أولي", "Persian": "آشناسازی شغلی", "Spanish": "formación inicial", "Ukrainian": "введення в посаду", "Russian": "вводный инструктаж", "Italian": "inserimento", "Swahili": "mafunzo ya awali" }, 
        "explanation": "The process of getting familiar with a new job or task. From 'sich einarbeiten' (to learn the ropes).", 
        "example_de": "Die Einarbeitung neuer Mitarbeiter dauert meistens vier Wochen.", "example_translated": "The onboarding of new employees usually takes four weeks.",
        "grammar": { "type": "noun", "singular": "die Einarbeitung", "plural": "die Einarbeitungen", "related": "sich einarbeiten (verb)" }
      }
    },
    {
      "id": "k2_001", "word": "geschickt sein", "notes": "Adjective phrase · §1", "status": "done",
      "data": { 
        "translations": { "English": "to be skillful / adroit", "French": "être habile", "Arabic": "يكون ماهراً", "Persian": "ماهر بودن", "Spanish": "ser hábil", "Ukrainian": "бути вправним", "Russian": "быть ловким", "Italian": "essere abile", "Swahili": "kuwa hodari" }, 
        "explanation": "Used often as 'handwerklich geschickt sein' meaning to be good with one's hands (craftsmanship).", 
        "example_de": "Für diesen Beruf muss man handwerklich geschickt sein.", "example_translated": "For this profession, one must be manually skilled.",
        "grammar": { "type": "adjective", "related": "das Geschick (noun)" }
      }
    },
    {
      "id": "k4_001", "word": "die Schichtarbeit", "notes": "Noun · §2", "status": "done",
      "data": { 
        "translations": { "English": "shift work", "French": "travail posté / travail en horaires décalés", "Arabic": "عمل بنظام الورديات", "Persian": "کار شیفتی", "Spanish": "trabajo por turnos", "Ukrainian": "позмінна робота", "Russian": "сменная работа", "Italian": "lavoro a turni", "Swahili": "kazi ya zamu" }, 
        "explanation": "Work scheduled outside standard daytime hours. Typically used in singular only (Sg.).", 
        "example_de": "In der Industrie ist Schichtarbeit sehr verbreitet.", "example_translated": "In industry, shift work is very common.",
        "grammar": { "type": "noun", "singular": "die Schichtarbeit", "plural": "— (Singular only)", "related": "die Schicht (noun)" }
      }
    }
  ],
  genLangs: ['English','French','Arabic','Persian','Spanish','Ukrainian','Russian','Italian','Swahili'],
  explLang: 'English'
};

let USER = { name: '', nativeLang: 'English', explLang: 'English', chapter: 'all', sessionSize: 20 };
let Q = { pool: [], queue: [], idx: 0, correct: 0, wrong: 0, streak: 0, maxStreak: 0, wrongItems: [], cur: null };

function persist() {
  try {
    localStorage.setItem('vok_w', JSON.stringify({words: W.words, genLangs: W.genLangs, explLang: W.explLang}));
    localStorage.setItem('vok_u', JSON.stringify(USER));
  } catch(e){}
}

function loadStorage() {
  try {
    const w = localStorage.getItem('vok_w');
    const u = localStorage.getItem('vok_u');
    if (w) { const parsed = JSON.parse(w); W.words = parsed.words || W.words; }
    if (u) Object.assign(USER, JSON.parse(u));
    const k = localStorage.getItem('vok_key');
    if (k) document.getElementById('m-apikey').value = k;
  } catch(e){}
}

function saveKey() {
  const k = document.getElementById('m-apikey').value.trim();
  if (k) localStorage.setItem('vok_key', k);
}

const uid = () => Math.random().toString(36).slice(2,9);
const getArticle = (word) => { const m = String(word||'').match(/^(die|der|das)\s+/i); return m ? m[1].toLowerCase() : null; };
const getBase = (word) => String(word||'').replace(/^(die|der|das)\s+/i,'').split(',')[0].split('(')[0].trim();
const getChapter = (word) => { const m = String((word&&word.id)||'').match(/^k(\d+)_/); return m ? m[1] : '?'; };

function detectChapters(words) {
  const chapters = new Set((words||[]).map(getChapter));
  return Array.from(chapters).sort((a,b)=> a==='?'?1:b==='?'?-1:parseInt(a)-parseInt(b));
}

function wordsForChapter(chapter) {
  if (chapter==='all') return W.words.filter(w=>w.status==='done');
  return W.words.filter(w=>w.status==='done' && getChapter(w)===chapter);
}

function importData(raw) {
  const words = Array.isArray(raw) ? raw : (raw.words || []);
  W.words = words.map(w => ({
    id: w.id||uid(), word:w.word||'', notes:w.notes||'',
    status: w.status==='done'?'done':'pending',
    data: w.status==='done'?(w.data||null):null,
  }));
  if (raw.meta?.targetLanguages) W.genLangs = raw.meta.targetLanguages;
  if (raw.meta?.explanationLanguage) W.explLang = raw.meta.explanationLanguage;
  persist(); buildOnboarding(); buildModal();
}

function importFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => { try { importData(JSON.parse(ev.target.result)); } catch { alert('Invalid JSON file.'); } };
  r.readAsText(file); e.target.value='';
}

function exportJSON() {
  const p = {
    meta: {targetLanguages:W.genLangs,explanationLanguage:W.explLang,exported:new Date().toISOString()},
    words: W.words.map(({id,word,notes,status,data})=>({id,word,notes,status,data})),
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));
  a.download='vocab.json'; a.click(); URL.revokeObjectURL(a.href);
}

// THE NEW CLAUDE API PROMPT - INCLUDES DEEP GRAMMAR
async function fetchTranslation(word, langs, explLang, key) {
  const schema = langs.map(l=>`"${l}": "translation here"`).join(', ');
  const prompt = `You are an expert German language teacher. For the German word/phrase: "${word}"
Provide ONLY valid JSON containing:
1. "translations": into ${langs.join(', ')}
2. "explanation": A clear explanation in ${explLang} (usage, context).
3. "example_de": One natural example sentence in German.
4. "example_translated": Translation of the example in ${explLang}.
5. "grammar": An object with:
   - "type": "noun", "verb", or "adjective"
   - If noun: "singular" (e.g. das Essen) and "plural" (e.g. die Essen, or "—" if none)
   - If verb: "conjugation" object mapping "ich", "du", "er/sie/es", "wir", "ihr", "sie/Sie"
   - "related": a string mentioning a related word family member (e.g. "essen (verb)") if applicable.

Example output structure:
{"translations":{${schema}},"explanation":"...","example_de":"...","example_translated":"...","grammar":{"type":"verb","conjugation":{"ich":"...","du":"...","er/sie/es":"...","wir":"...","ihr":"...","sie/Sie":"..."},"related":"..."}}`;

  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify({model:'claude-3-5-sonnet-20241022',max_tokens:1500, messages:[{role:'user',content:prompt}]}),
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  const json = await res.json();
  const raw = json.content.map(b=>b.text||'').join('').trim();
  const clean = raw.replace(/^```json\s*/i,'').replace(/```\s*$/i,'').trim();
  return JSON.parse(clean);
}

async function generateAll() {
  const key = getKey(); if (!key) { alert('Please enter your Anthropic API key.'); return; }
  if (Q.generating) return;
  const pending = W.words.filter(w=>w.status!=='done'); if (!pending.length) return;
  Q.generating = true;
  const btn = document.getElementById('m-gen-btn'); const prog = document.getElementById('m-prog');
  btn.disabled = true; prog.style.display='block';
  for (let i=0;i<pending.length;i++) {
    prog.innerHTML = `Translating ${i+1} / ${pending.length} <span>.</span><span>.</span><span>.</span>`;
    const idx = W.words.findIndex(w=>w.id===pending[i].id); if (idx<0) continue;
    W.words[idx].status = 'loading';
    try {
      W.words[idx].data = await fetchTranslation(pending[i].word, W.genLangs, W.explLang, key);
      W.words[idx].status = 'done';
    } catch(e) { W.words[idx].status = 'error'; }
    persist(); buildModal();
  }
  Q.generating = false; btn.disabled = false; prog.style.display='none'; buildOnboarding();
}

function buildMeaningOpts(entry, pool, lang) {
  if (!entry || !entry.data || !entry.data.translations) return [{txt:'—', isCorrect:true}, {txt:'—', isCorrect:false}, {txt:'—', isCorrect:false}, {txt:'—', isCorrect:false}];
  const correct = entry.data.translations[lang] || '?';
  const others = pool.filter(w => w.id!==entry.id && w.data?.translations?.[lang]).sort(()=>Math.random()-.5).slice(0,3).map(w => ({txt: w.data.translations[lang], isCorrect: false}));
  while (others.length < 3) others.push({txt:'—', isCorrect:false});
  const opts = [{txt:correct, isCorrect:true}, ...others];
  return opts.sort(()=>Math.random()-.5);
}

function startSession() {
  USER.name = document.getElementById('inp-name').value.trim() || 'Lerner';
  USER.nativeLang = document.getElementById('sel-native').value;
  USER.explLang = document.getElementById('sel-expl').value;
  USER.chapter = document.getElementById('sel-chapter').value;
  USER.sessionSize = document.getElementById('pill-size').querySelector('.on')?.dataset.n || '20';
  persist();
  const pool = wordsForChapter(USER.chapter);
  if (pool.length < 4) { alert(`Need at least 4 translated words to play.`); return; }
  Q.pool = pool;
  const n = USER.sessionSize==='all' ? pool.length : Math.min(parseInt(USER.sessionSize)||20, pool.length);
  Q.queue = pool.sort(()=>Math.random()-.5).slice(0,n).map(w=>w.id);
  Q.idx = 0; Q.correct = 0; Q.wrong = 0; Q.streak = 0; Q.maxStreak = 0; Q.wrongItems = []; Q.cur = null;
  showScreen('screen-quiz'); loadWord();
}

function replaySession() { startSession(); }

function reviewWrongWords() {
  if (!Q.wrongItems.length) { backToMenu(); return; }
  const ids = [...new Set(Q.wrongItems.map(w=>w.id))];
  Q.queue = ids; Q.idx = 0; Q.correct = 0; Q.wrong = 0; Q.streak = 0; Q.maxStreak = 0; Q.wrongItems = [];
  showScreen('screen-quiz'); loadWord();
}

function loadWord() {
  try {
    if (Q.idx >= Q.queue.length) { endSession(); return; }
    const entry = W.words.find(w=>w.id===Q.queue[Q.idx]);
    if (!entry) { Q.idx++; loadWord(); return; }
    
    const trueArticle = getArticle(entry.word);
    const opts = buildMeaningOpts(entry, Q.pool, USER.nativeLang);
    
    Q.cur = { 
      entry, 
      trueArticle, 
      hasArticle: !!trueArticle,
      phase: !!trueArticle ? 'article' : 'meaning', 
      options: opts, 
      artSelected: null,
      meanSelected: null,
      showDet: false,
      wordFailed: false
    };
    renderQuiz();
  } catch (err) {
    document.getElementById('qcard').innerHTML = `<div style="text-align:center; padding: 20px; color: var(--err)"><strong>App Error:</strong> ${err.message}<br><button class="btn btn-outline" style="margin-top:15px" onclick="backToMenu()">Return to Menu</button></div>`;
  }
}

function selectArticle(guess) {
  if (!Q.cur || Q.cur.phase !== 'article') return;
  Q.cur.artSelected = guess;
  
  if (guess === Q.cur.trueArticle) {
    Q.cur.phase = 'meaning';
  } else {
    Q.cur.wordFailed = true;
    Q.streak = 0;
    Q.cur.phase = 'meaning';
  }
  renderQuiz();
}

function selectMeaning(i) {
  if (!Q.cur || (Q.cur.phase !== 'meaning')) return;
  const opt = Q.cur.options[i];
  Q.cur.meanSelected = i;
  Q.cur.phase = 'done';
  
  if (!opt.isCorrect) Q.cur.wordFailed = true;

  if (Q.cur.wordFailed) {
    Q.wrong++; Q.streak = 0;
    Q.wrongItems.push({ id: Q.cur.entry.id, word: Q.cur.entry.word, correctMeaning: Q.cur.options.find(o=>o.isCorrect)?.txt || '—' });
    Q.queue.push(Q.queue[Q.idx]); // Re-add to queue
  } else {
    Q.correct++; Q.streak++; Q.maxStreak = Math.max(Q.maxStreak, Q.streak);
  }
  renderQuiz();
}

const nextWord = () => { Q.idx++; loadWord(); };

function endSession() {
  const pct = (Q.correct + Q.wrong) ? Math.round(Q.correct / (Q.correct + Q.wrong) * 100) : 0;
  renderSummary(pct); showScreen('screen-summary');
}
const confirmExit = () => { if (confirm('Exit to menu?')) backToMenu(); };
function backToMenu() { Q.cur = null; Q.queue = []; showScreen('screen-onboard'); buildOnboarding(); }

function h(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderQuiz() {
  const card = document.getElementById('qcard');
  if (!Q.cur) return;
  
  try {
    const { entry, phase, options, showDet, trueArticle, artSelected, meanSelected } = Q.cur;

    document.getElementById('qh-ok').textContent = `${Q.correct} ✓`;
    document.getElementById('qh-err').textContent = `${Q.wrong} ✗`;
    document.getElementById('qh-left').textContent = `${Math.max(0, Q.queue.length - Q.idx)} left`;
    const sb = document.getElementById('streak-badge');
    if (Q.streak >= 3) { sb.textContent = `🔥 ${Q.streak}`; sb.style.display=''; } else sb.style.display='none';
    document.getElementById('prog-fill').style.width = `${Math.round(Q.idx / Q.queue.length * 100)}%`;

    let artHTML = '';
    if (Q.cur.hasArticle) {
      if (phase === 'article') {
        artHTML = `
          <p class="phase-lbl anim-slide">Select the correct article</p>
          <div class="art-grid anim-slide">
            ${ARTICLES.map(a => `<button class="art-btn" onclick="selectArticle('${a}')">${a}</button>`).join('')}
          </div>`;
      } else {
        const color = (artSelected === trueArticle) ? 'var(--ok)' : 'var(--err)';
        artHTML = `<div style="text-align:center; font-family:var(--mono); font-size:22px; color:${color}; font-weight:bold; margin-bottom:15px;" class="anim-slide">${trueArticle}</div>`;
      }
    }

    let meanHTML = '';
    if (phase === 'meaning' || phase === 'done') {
      const keys = ['A','B','C','D'];
      const optsHTML = options.map((opt, i) => {
        let cls = 'opt';
        if (phase === 'done') {
          if (opt.isCorrect) cls += ' correct';
          else if (i === meanSelected) cls += ' wrong';
        }
        return `<button class="${cls} anim-slide" style="animation-delay: ${i*0.1}s" onclick="selectMeaning(${i})" ${phase==='done'?'disabled':''}>
          <span class="opt-key">${keys[i]}</span>
          <span class="opt-txt">${h(opt.txt)}</span>
        </button>`;
      }).join('');
      
      meanHTML = `
        <p class="phase-lbl anim-slide" style="margin-top:20px;">What does it mean?</p>
        <div class="opt-list">${optsHTML}</div>
      `;
    }

    let fbHTML = '';
    let nextHTML = '';
    if (phase === 'done') {
      if (Q.cur.wordFailed) {
        fbHTML = `<p class="feedback fb-err anim-slide">✗ Das war nicht ganz richtig.</p>`;
      } else {
        fbHTML = `<p class="feedback fb-ok anim-slide">✓ Richtig!</p>`;
      }
      nextHTML = `<button class="next-btn anim-slide" onclick="nextWord()">Next word →</button>`;
    }

    const explHTML = (showDet && entry.data) ? buildExplPanel(entry) : '';
    const explBtnHTML = (phase === 'done') ? `<button class="expl-btn anim-slide" onclick="toggleExpl()">📖 ${showDet?'Hide Grammar & Context':'View Grammar & Context'}</button>` : '';

    card.innerHTML = `
      <div class="word-area anim-slide">
        ${artHTML && phase !== 'article' ? artHTML : ''}
        <div class="word-main">${h(getBase(entry.word))}</div>
        ${entry.notes ? `<div class="word-note">${h(entry.notes)}</div>` : ''}
      </div>
      ${phase === 'article' ? artHTML : ''}
      ${meanHTML}
      ${fbHTML}
      ${nextHTML}
      ${explBtnHTML}
      ${explHTML}
    `;
  } catch(err) {
    card.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--err)"><strong>Error rendering card:</strong> ${err.message}<br><button class="btn btn-outline" style="margin-top:15px" onclick="backToMenu()">Return to Menu</button></div>`;
  }
}

const toggleExpl = () => { Q.cur.showDet = !Q.cur.showDet; renderQuiz(); };

function buildExplPanel(entry) {
  const d = entry.data; if (!d) return '';
  const g = d.grammar;
  
  // 1. Single Translation Display (Focused on User's Language)
  const userLang = USER.nativeLang;
  const userTranslation = d.translations?.[userLang] || 'Translation not available';
  
  // 2. Build Grammar Block dynamically based on Noun / Verb
  let grammarHTML = '';
  if (g) {
    if (g.type === 'noun') {
      grammarHTML = `
        <div class="grammar-box">
          <div class="grammar-grid">
            <div><span>Singular</span><span>${h(g.singular||'')}</span></div>
            <div><span>Plural</span><span>${h(g.plural||'')}</span></div>
          </div>
          ${g.related ? `<div style="margin-top:8px; font-size:12px; color:var(--dim)">Related: ${h(g.related)}</div>` : ''}
        </div>`;
    } else if (g.type === 'verb' && g.conjugation) {
      grammarHTML = `
        <div class="grammar-box">
          <div class="grammar-grid">
            <div><span>ich</span><span>${h(g.conjugation.ich||'')}</span></div>
            <div><span>wir</span><span>${h(g.conjugation.wir||'')}</span></div>
            <div><span>du</span><span>${h(g.conjugation.du||'')}</span></div>
            <div><span>ihr</span><span>${h(g.conjugation.ihr||'')}</span></div>
            <div><span>er/sie/es</span><span>${h(g.conjugation['er/sie/es']||'')}</span></div>
            <div><span>sie/Sie</span><span>${h(g.conjugation['sie/Sie']||'')}</span></div>
          </div>
          ${g.related ? `<div style="margin-top:8px; font-size:12px; color:var(--dim)">Related: ${h(g.related)}</div>` : ''}
        </div>`;
    } else if (g.related) {
      grammarHTML = `<div class="grammar-box" style="font-size:13px; color:var(--text);">Related: ${h(g.related)}</div>`;
    }
  }

  return `<div class="expl-panel anim-slide">
    <div class="expl-section" style="text-align:center; padding-bottom:10px;">
      <span class="lbl">Translation (${userLang})</span>
      <div style="font-family:var(--serif); font-size:22px; color:var(--gold);">${h(userTranslation)}</div>
    </div>
    <div class="expl-section">
      <span class="lbl">Grammar & Structure</span>
      ${grammarHTML}
      <p class="expl-txt" style="margin-top:10px;">${h(d.explanation)}</p>
    </div>
    <div class="expl-section">
      <span class="lbl">Example Sentence</span>
      <p class="expl-ex-de">„${h(d.example_de)}"</p>
      <p class="expl-ex-tr">${h(d.example_translated||'')}</p>
    </div>
    <div class="expl-section">
      <span class="lbl">External Dictionaries</span>
      <div class="link-row">${extLinks(entry.word, userLang).map(l=>`<a class="dlink" href="${l.u}" target="_blank">${l.n}</a>`).join('')}</div>
    </div>
  </div>`;
}

function renderSummary(pct) {
  document.getElementById('sum-name').textContent = USER.name;
  document.getElementById('sum-score').textContent = Q.correct;
  document.getElementById('sum-pct').textContent = `${pct}% accuracy · ${Q.correct}/${Q.queue.length} words`;
  document.getElementById('sum-chips').innerHTML = [['✓ Correct', Q.correct],['✗ Mistakes', Q.wrong],['🔥 Max Streak', Q.maxStreak],['📚 Chapter', USER.chapter==='all'?'All':`Kapitel ${USER.chapter}`]].map(([k,v])=>`<span class="stat-chip"><span>${v}</span>${k}</span>`).join('');
  
  const btnReview = document.getElementById('btn-review-wrong');
  if(Q.wrongItems.length > 0) {
    btnReview.style.display = 'inline-block';
    document.getElementById('sum-wrong-section').style.display = 'block';
    document.getElementById('sum-wrong-list').innerHTML = Q.wrongItems.map(w=>`<div class="wrong-item"><span class="wrong-de">${h(w.word)}</span><span class="wrong-tr">${h(w.correctMeaning)}</span></div>`).join('');
  } else {
    btnReview.style.display = 'none';
    document.getElementById('sum-wrong-section').style.display = 'none';
  }
}

function buildOnboarding() {
  ['sel-native','sel-expl'].forEach((id,k)=>{
    document.getElementById(id).innerHTML = LANGS.map(l=>`<option value="${l}" ${l===(k===0?USER.nativeLang:USER.explLang)?'selected':''}>${l}</option>`).join('');
  });
  const chapters = detectChapters(W.words);
  document.getElementById('sel-chapter').innerHTML = `<option value="all">All Chapters (${W.words.filter(w=>w.status==='done').length} loaded)</option>` + chapters.map(c=>`<option value="${c}" ${USER.chapter===c?'selected':''}>Kapitel ${c} (${W.words.filter(w=>w.status==='done'&&getChapter(w)===c).length} ready)</option>`).join('');
  const done = W.words.filter(w=>w.status==='done').length;
  document.getElementById('ob-info').innerHTML = W.words.length===0 ? '<span style="color:var(--err)">No vocabulary file detected.</span>' : (done<4 ? '<span style="color:var(--warn)">Translation indexing required. Open dictionary.</span>' : `<span style="color:var(--ok)">✓ ${done} words processed</span>`);
  document.getElementById('btn-start').disabled = done < 4;
}

function buildModal() {
  const chips = document.getElementById('m-lang-chips'); chips.innerHTML='';
  LANGS.forEach(lang=>{
    const c = document.createElement('span'); c.className = 'pill'+(W.genLangs.includes(lang)?' on':''); c.textContent = lang;
    c.onclick = ()=>{ W.genLangs = W.genLangs.includes(lang) ? W.genLangs.filter(l=>l!==lang) : [...W.genLangs, lang]; c.classList.toggle('on'); persist(); };
    chips.appendChild(c);
  });
  const done = W.words.filter(w=>w.status==='done').length;
  document.getElementById('m-stats').innerHTML = `${done} ready / ${W.words.length - done} pending`;
}

function openSettings() { buildModal(); document.getElementById('modal-bg').classList.add('on'); }
function closeModal() { document.getElementById('modal-bg').classList.remove('on'); buildOnboarding(); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); document.getElementById(id).classList.add('on'); }

document.getElementById('pill-size').addEventListener('click', e=>{
  const p = e.target.closest('.pill'); if(!p) return;
  document.querySelectorAll('#pill-size .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on');
  USER.sessionSize = p.dataset.n; persist();
});

loadStorage(); buildOnboarding();
fetch('./vocab.json').then(r=>r.json()).then(data=>{ if(W.words.length<=5) importData(data); }).catch(()=>{});
</script>
