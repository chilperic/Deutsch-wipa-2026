<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card" id="app">
    <h1>Vokabular Mastery</h1>
    <div id="content">Loading Data...</div>
</div>
<script src="js/storage.js"></script>
<script src="js/quiz.js"></script>
<script>
    let db = [];
    async function init() {
        // Load all 4 chapters
        for(let i=1; i<=4; i++) {
            const res = await fetch(`./data/kapitel${i}.json`);
            const data = await res.json();
            db.push(...data);
        }
        renderQuiz();
    }

    function renderQuiz() {
        const w = db[Math.floor(Math.random() * db.length)];
        document.getElementById('content').innerHTML = `
            <h3>${w.word}</h3>
            <input id="gender" placeholder="Gender (der/die/das)">
            <input id="plural" placeholder="Plural">
            <input id="tr" placeholder="Translation (${w.data.translations.Persian})">
            <button onclick="check('${w.id}', '${w.gender}', '${w.plural}', '${w.data.translations.Persian}')">Submit</button>
        `;
    }

    function check(id, g, p, tr) {
        const guessG = document.getElementById('gender').value;
        const guessP = document.getElementById('plural').value;
        const guessT = document.getElementById('tr').value;
        
        const isCorrect = Quiz.validate(guessG, g) && Quiz.validate(guessP, p) && Quiz.validate(guessT, tr);
        Storage.save(id, isCorrect);
        alert(isCorrect ? "Mastered!" : "Review needed.");
        renderQuiz();
    }
    init();
</script>
</body>
</html>
